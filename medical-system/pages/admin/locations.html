<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Management | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Location Management</h1><p id="pageSub">Pavilions and consulting rooms where appointments take place.</p></div>
        <button class="btn btn-primary" id="newBtn"><i class="fa-solid fa-plus"></i> Add Location</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Pavilion</th><th>Room code</th><th>Actions</th></tr></thead>
          <tbody id="lBody"></tbody>
        </table>
      </div>
      <div id="lEmpty"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="locModal">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle">Add Location</h3><button class="modal-close" onclick="closeModal('locModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group"><label for="fPab">Pavilion <span class="req">*</span></label><input type="text" id="fPab" maxlength="20" placeholder="Pabellón A"></div>
        <div class="form-group"><label for="fRoom">Room code <span class="req">*</span></label><input type="text" id="fRoom" maxlength="20" placeholder="A-101"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('locModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('locations.html');
    (async () => {
      try {

      const body = qs('#lBody'), empty = qs('#lEmpty');
      let locs = [];
      const val = id => document.getElementById(id).value.trim();
      async function load() {
        skeletonRows(body, 3, 3);
        locs = await Api.consultorios.list();
        if (locs.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-location-dot', 'No locations yet', 'Add the first consulting room.'); return; }
        empty.innerHTML = '';
        body.innerHTML = locs.map(l => `
          <tr><td><strong>${esc(l.numeroPabellon)}</strong></td><td>${esc(l.codigoRoom)}</td>
            <td class="table-actions"><button class="btn btn-outline btn-sm" data-id="${l.idConsultorio}" data-tooltip="Edit"><i class="fa-solid fa-pen"></i></button></td></tr>`).join('');
      }
      qs('#newBtn').addEventListener('click', () => { qs('#modalTitle').textContent = 'Add Location'; ['editId', 'fPab', 'fRoom'].forEach(i => document.getElementById(i).value = ''); openModal('locModal'); });
      body.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]'); if (!b) return;
        const l = locs.find(x => String(x.idConsultorio) === b.dataset.id); if (!l) return;
        qs('#modalTitle').textContent = 'Edit Location'; qs('#editId').value = l.idConsultorio;
        qs('#fPab').value = l.numeroPabellon; qs('#fRoom').value = l.codigoRoom; openModal('locModal');
      });
      qs('#saveBtn').addEventListener('click', async () => {
        if (!val('fPab') || !val('fRoom')) { toast('Pavilion and room code are required.', 'error'); return; }
        const payload = { numeroPabellon: val('fPab'), codigoRoom: val('fRoom') }, id = val('editId');
        await safe(async () => {
          if (id) await Api.consultorios.update(id, payload); else await Api.consultorios.create(payload);
          toast('Location saved.', 'success'); closeModal('locModal'); await load();
        });
      });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
