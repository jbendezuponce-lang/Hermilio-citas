<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Management | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Patient Management</h1><p id="pageSub">View and manage registered patients.</p></div>
        
      </div>
      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="pSearch" placeholder="Search by name, email or document..."></div>
        <select class="filter-select" id="pStatus"><option value="">All Statuses</option><option value="1">Active</option><option value="0">Inactive</option></select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Patient</th><th>Document</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="pBody"></tbody>
        </table>
      </div>
      <div id="pEmpty"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="detModal">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle">Patient</h3><button class="modal-close" onclick="closeModal('detModal')">&times;</button></div>
    <div class="modal-body"><div id="detailBox"></div></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('detModal')">Close</button></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('patients.html');
    (async () => {
      try {

      const body = qs('#pBody'), empty = qs('#pEmpty');
      let patients = [];
      const val = id => document.getElementById(id).value.trim();

      async function load() {
        skeletonRows(body, 4, 5);
        patients = (await Api.usuarios.list()).filter(u => u.rol === 'PACIENTE');
        render();
      }
      function render() {
        const term = val('pSearch').toLowerCase(), st = val('pStatus');
        const list = patients
          .filter(p => st === '' || String(p.activo ? 1 : 0) === st)
          .filter(p => !term || (fullName(p) + ' ' + p.correo + ' ' + p.documentoIdentidad).toLowerCase().includes(term));
        if (list.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-users', 'No patients found', 'Patients register themselves from the app or at the front desk.'); return; }
        empty.innerHTML = '';
        body.innerHTML = list.map(p => `
          <tr>
            <td><div class="flex items-center gap-12"><span class="avatar-sm">${initials(fullName(p))}</span><span>${esc(fullName(p))}</span></div></td>
            <td>${esc(p.documentoIdentidad)}</td><td>${esc(p.correo)}</td><td>${activoBadge(p.activo)}</td>
            <td class="table-actions">
              <button class="btn btn-outline btn-sm" data-act="view" data-id="${p.idUsuario}" data-tooltip="Details"><i class="fa-solid fa-eye"></i></button>
              <button class="btn btn-outline btn-sm" data-act="toggle" data-id="${p.idUsuario}" data-tooltip="${p.activo ? 'Deactivate' : 'Activate'}"><i class="fa-solid ${p.activo ? 'fa-user-slash' : 'fa-user-check'}"></i></button>
            </td>
          </tr>`).join('');
      }
      body.addEventListener('click', async (e) => {
        const b = e.target.closest('button[data-act]'); if (!b) return;
        const p = patients.find(x => String(x.idUsuario) === b.dataset.id); if (!p) return;
        if (b.dataset.act === 'toggle') {
          await safe(async () => { await Api.usuarios.estado(p.idUsuario, !p.activo); toast(`Patient ${p.activo ? 'deactivated' : 'activated'}.`, 'success'); await load(); });
        } else {
          await safe(async () => {
            const d = await Api.pacientes.buscar(p.documentoIdentidad);
            qs('#modalTitle').textContent = fullName(p);
            qs('#detailBox').innerHTML = `<table class="data-table" style="min-width:0;"><tbody>
              <tr><td style="font-weight:600;">Document ID</td><td>${esc(d.documentoIdentidad)}</td></tr>
              <tr><td style="font-weight:600;">Email</td><td>${esc(d.correo)}</td></tr>
              <tr><td style="font-weight:600;">Phone</td><td>${esc(d.telefonoContacto || '—')}</td></tr>
              <tr><td style="font-weight:600;">Insurance</td><td>${esc(d.tipoSeguro || '—')}</td></tr>
              <tr><td style="font-weight:600;">Guardian data</td><td>${esc(d.datosApoderado || '—')}</td></tr></tbody></table>`;
            openModal('detModal');
          });
        }
      });
      ['pSearch', 'pStatus'].forEach(id => { document.getElementById(id).addEventListener('input', debounce(render, 150)); document.getElementById(id).addEventListener('change', render); });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
