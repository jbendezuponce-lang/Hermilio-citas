<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header"><div><h1 id="welcomeMsg">Welcome back!</h1><p>System-wide overview and analytics.</p></div></div>

      <div class="dashboard-grid" id="statsGrid"></div>

      <div class="two-col">
        <div class="card"><h4>Appointments by Month</h4><canvas id="monthChart" height="220"></canvas></div>
        <div class="card"><h4>Appointments by Specialty</h4><canvas id="specChart" height="220"></canvas></div>
      </div>
      <div class="two-col" style="margin-top:22px;">
        <div class="card"><h4>New Patients (last 6 months)</h4><canvas id="patientsChart" height="220"></canvas></div>
        <div class="card"><h4>Consultation Statistics</h4><canvas id="statusChart" height="220"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('dashboard.html');
    document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';

    const patients = DB.get(DB_KEYS.patients);
    const doctors = DB.get(DB_KEYS.doctors);
    const users = DB.get(DB_KEYS.users);
    const appts = DB.get(DB_KEYS.appointments);
    const specialties = DB.get(DB_KEYS.specialties);
    const specMap = Object.fromEntries(specialties.map(s => [s.id, s.name]));

    const todayAppts = appts.filter(a => a.date === today());
    const monthAppts = appts.filter(a => a.date.slice(0, 7) === today().slice(0, 7));
    const cancelled = appts.filter(a => a.status === 'Cancelled');
    const completed = appts.filter(a => a.status === 'Completed');

    document.getElementById('statsGrid').innerHTML = `
      <div class="card stat-card"><div class="stat-icon blue"><i class="fa-solid fa-users"></i></div><div><div class="stat-value">${patients.length}</div><div class="stat-label">Total Patients</div></div></div>
      <div class="card stat-card"><div class="stat-icon teal"><i class="fa-solid fa-user-doctor"></i></div><div><div class="stat-value">${doctors.length}</div><div class="stat-label">Total Doctors</div></div></div>
      <div class="card stat-card"><div class="stat-icon purple"><i class="fa-solid fa-user-gear"></i></div><div><div class="stat-value">${users.length}</div><div class="stat-label">Total Users</div></div></div>
      <div class="card stat-card"><div class="stat-icon amber"><i class="fa-solid fa-calendar-day"></i></div><div><div class="stat-value">${todayAppts.length}</div><div class="stat-label">Today's Appointments</div></div></div>
      <div class="card stat-card"><div class="stat-icon green"><i class="fa-solid fa-calendar-check"></i></div><div><div class="stat-value">${monthAppts.length}</div><div class="stat-label">Monthly Appointments</div></div></div>
      <div class="card stat-card"><div class="stat-icon red"><i class="fa-solid fa-calendar-xmark"></i></div><div><div class="stat-value">${cancelled.length}</div><div class="stat-label">Cancelled Appointments</div></div></div>
      <div class="card stat-card"><div class="stat-icon blue"><i class="fa-solid fa-circle-check"></i></div><div><div class="stat-value">${completed.length}</div><div class="stat-label">Completed Consultations</div></div></div>`;

    const chartColors = ['#0f7c8c', '#2563eb', '#14b8a6', '#d97706', '#dc2626', '#7c3aed', '#16a34a'];

    // Appointments by month (last 6 months)
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(); d.setMonth(d.getMonth() - i);
      months.push(d.toISOString().slice(0, 7));
    }
    const monthCounts = months.map(m => appts.filter(a => a.date.slice(0, 7) === m).length);
    new Chart(document.getElementById('monthChart'), {
      type: 'bar',
      data: { labels: months.map(m => new Date(m + '-01').toLocaleDateString('en-US', { month: 'short' })), datasets: [{ label: 'Appointments', data: monthCounts, backgroundColor: '#0f7c8c', borderRadius: 6 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });

    // By specialty
    const specCounts = specialties.map(s => appts.filter(a => a.specialtyId === s.id).length);
    new Chart(document.getElementById('specChart'), {
      type: 'doughnut',
      data: { labels: specialties.map(s => s.name), datasets: [{ data: specCounts, backgroundColor: chartColors.concat(['#64767d', '#f59e0b', '#0ea5e9']) }] },
      options: { plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } } } }
    });

    // New patients last 6 months
    const patientCounts = months.map(m => patients.filter(p => p.registered && p.registered.slice(0, 7) === m).length);
    new Chart(document.getElementById('patientsChart'), {
      type: 'line',
      data: { labels: months.map(m => new Date(m + '-01').toLocaleDateString('en-US', { month: 'short' })), datasets: [{ label: 'New Patients', data: patientCounts, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.1)', fill: true, tension: .35 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });

    // Status distribution
    const statuses = ['Confirmed', 'Pending', 'Completed', 'Cancelled'];
    const statusCounts = statuses.map(s => appts.filter(a => a.status === s).length);
    new Chart(document.getElementById('statusChart'), {
      type: 'pie',
      data: { labels: statuses, datasets: [{ data: statusCounts, backgroundColor: ['#2563eb', '#d97706', '#16a34a', '#dc2626'] }] },
      options: { plugins: { legend: { position: 'right' } } }
    });
  }
</script>
</body>
</html>
