<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Welcome back!</h1><p id="pageSub">System-wide overview and analytics.</p></div>
        
      </div>
      <div class="dashboard-grid" id="statsGrid"></div>
      <div class="two-col">
        <div class="card"><h4>Appointments by Month</h4><canvas id="monthChart" height="220"></canvas></div>
        <div class="card"><h4>Appointments by Specialty</h4><canvas id="specChart" height="220"></canvas></div>
      </div>
      <div class="two-col" style="margin-top:22px;">
        <div class="card"><h4>Users by Role</h4><canvas id="roleChart" height="220"></canvas></div>
        <div class="card"><h4>Appointment Status (last 6 months)</h4><canvas id="statusChart" height="220"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('dashboard.html');
    (async () => {
      try {

      qs('#pageTitle').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';
      qs('#pageSub').textContent = 'System-wide overview and analytics (live data from the database).';
      const monthRange = (off) => {
        const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off);
        const y = d.getFullYear(), m = d.getMonth();
        return { start: isoDate(new Date(y, m, 1)), end: isoDate(new Date(y, m + 1, 0)), label: new Date(y, m, 1).toLocaleDateString('en-US', { month: 'short' }) };
      };
      const months = [-5, -4, -3, -2, -1, 0].map(monthRange);
      const rangeStart = months[0].start, rangeEnd = months[5].end;
      const [users, perMonth, total, hoy, bySpec] = await Promise.all([
        Api.usuarios.list(),
        Promise.all(months.map(m => Api.reportes.citas(m.start, m.end))),
        Api.reportes.citas(rangeStart, rangeEnd),
        Api.reportes.citas(today(), today()),
        Api.reportes.inasistencia(rangeStart, rangeEnd)
      ]);
      const count = r => users.filter(u => u.rol === r).length;
      const card = (icon, color, val, label) => `<div class="card stat-card"><div class="stat-icon ${color}"><i class="fa-solid ${icon}"></i></div><div><div class="stat-value">${val}</div><div class="stat-label">${label}</div></div></div>`;
      qs('#statsGrid').innerHTML =
        card('fa-users', 'blue', count('PACIENTE'), 'Total Patients') +
        card('fa-user-doctor', 'teal', count('MEDICO'), 'Total Doctors') +
        card('fa-user-gear', 'purple', users.length, 'Total Users') +
        card('fa-calendar-day', 'amber', hoy.total, "Today's Appointments") +
        card('fa-calendar-check', 'green', perMonth[5].total, 'Appointments This Month') +
        card('fa-calendar-xmark', 'red', total.canceladas, 'Cancelled (6 months)') +
        card('fa-circle-check', 'blue', total.atendidas, 'Completed (6 months)');
      const colors = ['#0f7c8c', '#2563eb', '#14b8a6', '#d97706', '#dc2626', '#7c3aed', '#16a34a'];
      new Chart(qs('#monthChart'), { type: 'bar',
        data: { labels: months.map(m => m.label), datasets: [{ label: 'Appointments', data: perMonth.map(r => r.total), backgroundColor: '#0f7c8c', borderRadius: 6 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
      const filas = bySpec.filas || [];
      new Chart(qs('#specChart'), { type: 'doughnut',
        data: { labels: filas.length ? filas.map(f => f.especialidad) : ['No data'], datasets: [{ data: filas.length ? filas.map(f => f.citasConsideradas) : [1], backgroundColor: filas.length ? colors : ['#cbd5e1'] }] },
        options: { plugins: { legend: { position: 'right', labels: { boxWidth: 12, font: { size: 10 } } } } } });
      const roles = ['PACIENTE', 'MEDICO', 'RECEPCIONISTA', 'ADMINISTRADOR'];
      new Chart(qs('#roleChart'), { type: 'pie',
        data: { labels: roles.map(r => ROL_LABEL[r]), datasets: [{ data: roles.map(count), backgroundColor: colors }] },
        options: { plugins: { legend: { position: 'right' } } } });
      const st = [['Confirmed/Active', total.total - total.atendidas - total.canceladas - total.noAsistio], ['Completed', total.atendidas], ['Cancelled', total.canceladas], ['No-show', total.noAsistio]];
      new Chart(qs('#statusChart'), { type: 'pie',
        data: { labels: st.map(x => x[0]), datasets: [{ data: st.map(x => Math.max(0, x[1])), backgroundColor: ['#2563eb', '#16a34a', '#dc2626', '#64767d'] }] },
        options: { plugins: { legend: { position: 'right' } } } });
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
