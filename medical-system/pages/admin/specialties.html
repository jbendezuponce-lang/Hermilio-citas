<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specialty Management | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Specialty Management</h1><p id="pageSub">Configure the medical specialties offered by the hospital.</p></div>
        <button class="btn btn-primary" id="newBtn"><i class="fa-solid fa-plus"></i> Add Specialty</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Specialty</th><th>Description</th><th>Actions</th></tr></thead>
          <tbody id="sBody"></tbody>
        </table>
      </div>
      <div id="sEmpty"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="spModal">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle">Add Specialty</h3><button class="modal-close" onclick="closeModal('spModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group"><label for="fName">Name <span class="req">*</span></label><input type="text" id="fName" maxlength="80"></div>
      <div class="form-group"><label for="fDesc">Description</label><textarea id="fDesc" maxlength="255" rows="3"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('spModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('specialties.html');
    (async () => {
      try {

      const body = qs('#sBody'), empty = qs('#sEmpty');
      let specs = [];
      const val = id => document.getElementById(id).value.trim();
      async function load() {
        skeletonRows(body, 3, 3);
        specs = await Api.especialidades.list();
        if (specs.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-stethoscope', 'No specialties yet', 'Add the first specialty.'); return; }
        empty.innerHTML = '';
        body.innerHTML = specs.map(s => `
          <tr><td><strong>${esc(s.nombreEspecialidad)}</strong></td><td>${esc(s.descripcion || '—')}</td>
            <td class="table-actions">
              <button class="btn btn-outline btn-sm" data-act="edit" data-id="${s.idEspecialidad}" data-tooltip="Edit"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-danger btn-sm" data-act="del" data-id="${s.idEspecialidad}" data-tooltip="Delete"><i class="fa-solid fa-trash"></i></button>
            </td></tr>`).join('');
      }
      qs('#newBtn').addEventListener('click', () => { qs('#modalTitle').textContent = 'Add Specialty'; ['editId', 'fName', 'fDesc'].forEach(i => document.getElementById(i).value = ''); openModal('spModal'); });
      body.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-act]'); if (!b) return;
        const s = specs.find(x => String(x.idEspecialidad) === b.dataset.id); if (!s) return;
        if (b.dataset.act === 'edit') {
          qs('#modalTitle').textContent = 'Edit Specialty'; qs('#editId').value = s.idEspecialidad;
          qs('#fName').value = s.nombreEspecialidad; qs('#fDesc').value = s.descripcion || ''; openModal('spModal');
        } else {
          confirmDialog(`Delete the specialty “${esc(s.nombreEspecialidad)}”? It can only be deleted if no doctors use it.`, () => safe(async () => {
            await Api.especialidades.remove(s.idEspecialidad); toast('Specialty deleted.', 'success'); await load();
          }), { danger: true, confirmText: 'Delete' });
        }
      });
      qs('#saveBtn').addEventListener('click', async () => {
        if (!val('fName')) { toast('The name is required.', 'error'); return; }
        const payload = { nombreEspecialidad: val('fName'), descripcion: val('fDesc') || null }, id = val('editId');
        await safe(async () => {
          if (id) await Api.especialidades.update(id, payload); else await Api.especialidades.create(payload);
          toast('Specialty saved.', 'success'); closeModal('spModal'); await load();
        });
      });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
