<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">User Management</h1><p id="pageSub">Create and manage accounts and roles.</p></div>
        <button class="btn btn-primary" id="newBtn"><i class="fa-solid fa-user-plus"></i> Add User</button>
      </div>
      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="uSearch" placeholder="Search by name, email or document..."></div>
        <select class="filter-select" id="uRole"><option value="">All Roles</option><option value="PACIENTE">Patient</option><option value="RECEPCIONISTA">Receptionist</option><option value="MEDICO">Doctor</option><option value="ADMINISTRADOR">Administrator</option></select>
        <select class="filter-select" id="uStatus"><option value="">All Statuses</option><option value="1">Active</option><option value="0">Inactive</option></select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>User</th><th>Document</th><th>Email</th><th>Role</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="uBody"></tbody>
        </table>
      </div>
      <div id="uEmpty"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="userModal">
  <div class="modal-box modal-lg">
    <div class="modal-header"><h3 id="modalTitle">Add User</h3><button class="modal-close" onclick="closeModal('userModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group"><label for="fNombres">First names <span class="req">*</span></label><input type="text" id="fNombres" maxlength="100"></div>
        <div class="form-group"><label for="fApellidos">Last names <span class="req">*</span></label><input type="text" id="fApellidos" maxlength="100"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="fDoc">Document ID (8-15 chars) <span class="req">*</span></label><input type="text" id="fDoc" maxlength="15"></div>
        <div class="form-group"><label for="fCorreo">Email <span class="req">*</span></label><input type="email" id="fCorreo" maxlength="150"></div>
      </div>
      <div class="form-row">
        <div class="form-group" id="gPass"><label for="fPass">Password (min. 8) <span class="req">*</span></label><input type="password" id="fPass" maxlength="72" autocomplete="new-password"></div>
        <div class="form-group"><label for="fRol">Role <span class="req">*</span></label>
          <select id="fRol"><option value="RECEPCIONISTA">Receptionist</option><option value="MEDICO">Doctor</option><option value="ADMINISTRADOR">Administrator</option></select></div>
      </div>
      <div class="form-row" id="rowMedico">
        <div class="form-group"><label for="fEsp">Specialty <span class="req">*</span></label><select id="fEsp"></select></div>
        <div class="form-group"><label for="fCol">Professional license no. <span class="req">*</span></label><input type="text" id="fCol" maxlength="20" placeholder="CMP-12345"></div>
      </div>
      <div class="form-group" id="rowCargo"><label for="fCargo">Position</label><input type="text" id="fCargo" maxlength="80" placeholder="e.g. Recepcionista Principal"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save User</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('users.html');
    (async () => {
      try {

      const body = qs('#uBody'), empty = qs('#uEmpty');
      let users = [], specs = [];
      const val = id => document.getElementById(id).value.trim();

      async function load() {
        skeletonRows(body, 4, 7);
        [users, specs] = await Promise.all([Api.usuarios.list(), Api.especialidades.list()]);
        qs('#fEsp').innerHTML = specs.map(s => `<option value="${s.idEspecialidad}">${esc(s.nombreEspecialidad)}</option>`).join('');
        render();
      }

      function render() {
        const term = val('uSearch').toLowerCase(), role = val('uRole'), st = val('uStatus');
        const list = users
          .filter(u => !role || u.rol === role)
          .filter(u => st === '' || String(u.activo ? 1 : 0) === st)
          .filter(u => !term || (fullName(u) + ' ' + u.correo + ' ' + u.documentoIdentidad).toLowerCase().includes(term));
        if (list.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-users', 'No users found', 'Try a different search or filter.'); return; }
        empty.innerHTML = '';
        body.innerHTML = list.map(u => `
          <tr>
            <td><div class="flex items-center gap-12"><span class="avatar-sm">${initials(fullName(u))}</span><span>${esc(fullName(u))}</span></div></td>
            <td>${esc(u.documentoIdentidad)}</td>
            <td>${esc(u.correo)}</td>
            <td>${rolBadge(u.rol)}</td>
            <td>${esc(u.especialidad ? u.especialidad + ' · ' + (u.numeroColegiatura || '') : (u.cargo || '—'))}</td>
            <td>${activoBadge(u.activo)}</td>
            <td class="table-actions">
              <button class="btn btn-outline btn-sm" data-act="edit" data-id="${u.idUsuario}" data-tooltip="Edit"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-outline btn-sm" data-act="toggle" data-id="${u.idUsuario}" data-tooltip="${u.activo ? 'Deactivate' : 'Activate'}"><i class="fa-solid ${u.activo ? 'fa-user-slash' : 'fa-user-check'}"></i></button>
            </td>
          </tr>`).join('');
      }

      function roleFields() {
        const r = val('fRol');
        qs('#rowMedico').style.display = r === 'MEDICO' ? '' : 'none';
        qs('#rowCargo').style.display = r === 'MEDICO' || r === 'PACIENTE' ? 'none' : '';
      }
      qs('#fRol').addEventListener('change', roleFields);

      qs('#newBtn').addEventListener('click', () => {
        qs('#modalTitle').textContent = 'Add User';
        ['editId', 'fNombres', 'fApellidos', 'fDoc', 'fCorreo', 'fPass', 'fCol', 'fCargo'].forEach(id => document.getElementById(id).value = '');
        qs('#fRol').disabled = false; qs('#fRol').value = 'RECEPCIONISTA';
        qs('#fDoc').disabled = false; qs('#gPass').style.display = '';
        Array.from(qs('#fRol').options).forEach(o => o.hidden = false);
        roleFields(); openModal('userModal');
      });

      body.addEventListener('click', async (e) => {
        const b = e.target.closest('button[data-act]'); if (!b) return;
        const u = users.find(x => String(x.idUsuario) === b.dataset.id); if (!u) return;
        if (b.dataset.act === 'toggle') {
          await safe(async () => {
            await Api.usuarios.estado(u.idUsuario, !u.activo);
            toast(`User ${u.activo ? 'deactivated' : 'activated'}.`, 'success');
            await load();
          });
        } else {
          qs('#modalTitle').textContent = 'Edit User';
          qs('#editId').value = u.idUsuario;
          qs('#fNombres').value = u.nombres; qs('#fApellidos').value = u.apellidos;
          qs('#fDoc').value = u.documentoIdentidad; qs('#fDoc').disabled = true;
          qs('#fCorreo').value = u.correo; qs('#gPass').style.display = 'none';
          // el rol solo puede cambiar entre Receptionist y Administrator
          const admin = u.rol === 'RECEPCIONISTA' || u.rol === 'ADMINISTRADOR';
          Array.from(qs('#fRol').options).forEach(o => o.hidden = !(admin ? (o.value === 'RECEPCIONISTA' || o.value === 'ADMINISTRADOR') : o.value === u.rol));
          if (!admin && ![...qs('#fRol').options].some(o => o.value === u.rol)) qs('#fRol').add(new Option(ROL_LABEL[u.rol], u.rol));
          qs('#fRol').value = u.rol; qs('#fRol').disabled = !admin;
          if (u.idEspecialidad) qs('#fEsp').value = u.idEspecialidad;
          qs('#fCol').value = u.numeroColegiatura || ''; qs('#fCargo').value = u.cargo || '';
          roleFields(); openModal('userModal');
        }
      });

      qs('#saveBtn').addEventListener('click', async () => {
        const id = val('editId'), rol = val('fRol');
        if (!val('fNombres') || !val('fApellidos')) { toast('First and last names are required.', 'error'); return; }
        if (!isValidEmail(val('fCorreo'))) { toast('Enter a valid email.', 'error'); return; }
        if (!id) {
          if (val('fDoc').length < 8 || val('fDoc').length > 15) { toast('Document ID must have 8 to 15 characters.', 'error'); return; }
          if (qs('#fPass').value.length < 8) { toast('Password must have at least 8 characters.', 'error'); return; }
        }
        if (rol === 'MEDICO' && (!val('fEsp') || !val('fCol'))) { toast('Doctors need a specialty and a license number.', 'error'); return; }
        const payload = {
          nombres: val('fNombres'), apellidos: val('fApellidos'), correo: val('fCorreo'), rol,
          idEspecialidad: rol === 'MEDICO' ? Number(val('fEsp')) : null,
          numeroColegiatura: rol === 'MEDICO' ? val('fCol') : null,
          cargo: rol === 'MEDICO' ? null : (val('fCargo') || null)
        };
        await safe(async () => {
          if (id) { await Api.usuarios.update(id, payload); toast('User updated.', 'success'); }
          else { await Api.usuarios.create({ ...payload, documentoIdentidad: val('fDoc'), password: qs('#fPass').value }); toast('User created and saved in the database.', 'success'); }
          closeModal('userModal'); await load();
        });
      });

      ['uSearch', 'uRole', 'uStatus'].forEach(id => {
        document.getElementById(id).addEventListener('input', debounce(render, 150));
        document.getElementById(id).addEventListener('change', render);
      });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
