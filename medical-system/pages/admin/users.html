<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1>User Management</h1><p>Manage all platform users and their roles.</p></div>
        <button class="btn btn-primary" id="newUserBtn"><i class="fa-solid fa-user-plus"></i> Create User</button>
      </div>

      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="uSearch" placeholder="Search by name or email..."></div>
        <select class="filter-select" id="uRole"><option value="">All Roles</option><option value="admin">Administrator</option><option value="doctor">Doctor</option><option value="receptionist">Receptionist</option><option value="patient">Patient</option></select>
        <select class="filter-select" id="uStatus"><option value="">All Statuses</option><option>Active</option><option>Inactive</option></select>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Registered</th><th>Last Activity</th><th>Actions</th></tr></thead>
          <tbody id="uBody"></tbody>
        </table>
      </div>
      <div id="uEmpty"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="userModal">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modalTitle">Create User</h3><button class="modal-close" onclick="closeModal('userModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group"><label for="fName">Full Name</label><input type="text" id="fName"></div>
      <div class="form-group"><label for="fEmail">Email</label><input type="email" id="fEmail"></div>
      <div class="form-group"><label for="fRole">Role</label>
        <select id="fRole"><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="receptionist">Receptionist</option><option value="admin">Administrator</option></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('userModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save User</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('users.html');
    const roleLabels = { admin: 'Administrator', doctor: 'Doctor', receptionist: 'Receptionist', patient: 'Patient' };
    const roleBadge = { admin: 'badge-purple', doctor: 'badge-blue', receptionist: 'badge-teal', patient: 'badge-gray' };

    function render() {
      const term = document.getElementById('uSearch').value.toLowerCase().trim();
      const role = document.getElementById('uRole').value;
      const status = document.getElementById('uStatus').value;
      const list = DB.get(DB_KEYS.users)
        .filter(u => !role || u.role === role)
        .filter(u => !status || u.status === status)
        .filter(u => !term || u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term));

      const body = document.getElementById('uBody');
      const empty = document.getElementById('uEmpty');
      if (list.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-user-gear', 'No users found', 'Try a different search or filter.'); return; }
      empty.innerHTML = '';
      body.innerHTML = list.map(u => `
        <tr>
          <td><div class="flex items-center gap-12"><span class="avatar-sm">${initials(u.name)}</span><span>${u.name}</span></div></td>
          <td>${u.email}</td>
          <td><span class="badge ${roleBadge[u.role]}">${roleLabels[u.role]}</span></td>
          <td>${statusBadge(u.status)}</td>
          <td>${formatDate(u.registered)}</td>
          <td>${formatDate(u.lastActivity)}</td>
          <td class="table-actions">
            <button class="btn btn-outline btn-sm edit-btn" data-id="${u.id}" data-tooltip="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-outline btn-sm toggle-btn" data-id="${u.id}" data-tooltip="${u.status === 'Active' ? 'Deactivate' : 'Activate'}"><i class="fa-solid ${u.status === 'Active' ? 'fa-user-slash' : 'fa-user-check'}"></i></button>
            <button class="btn btn-outline btn-sm reset-btn" data-id="${u.id}" data-tooltip="Reset password"><i class="fa-solid fa-key"></i></button>
          </td>
        </tr>`).join('');

      qsa('.edit-btn').forEach(b => b.addEventListener('click', () => {
        const u = DB.find(DB_KEYS.users, b.dataset.id);
        document.getElementById('modalTitle').textContent = 'Edit User';
        document.getElementById('editId').value = u.id;
        document.getElementById('fName').value = u.name;
        document.getElementById('fEmail').value = u.email;
        document.getElementById('fRole').value = u.role;
        openModal('userModal');
      }));
      qsa('.toggle-btn').forEach(b => b.addEventListener('click', () => {
        const u = DB.find(DB_KEYS.users, b.dataset.id);
        const newStatus = u.status === 'Active' ? 'Inactive' : 'Active';
        DB.update(DB_KEYS.users, u.id, { status: newStatus });
        addAuditLog(user.name, (newStatus === 'Active' ? 'Activated' : 'Deactivated') + ' user account', 'Users');
        toast(`User ${newStatus === 'Active' ? 'activated' : 'deactivated'}.`, 'success');
        render();
      }));
      qsa('.reset-btn').forEach(b => b.addEventListener('click', () => {
        confirmDialog('Send a password reset link to this user? (simulated)', () => {
          addAuditLog(user.name, 'Reset user password', 'Users');
          toast('Password reset link sent (simulated).', 'success');
        });
      }));
    }

    document.getElementById('newUserBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = 'Create User';
      ['editId', 'fName', 'fEmail'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('fRole').value = 'patient';
      openModal('userModal');
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('fName').value.trim();
      const email = document.getElementById('fEmail').value.trim();
      const role = document.getElementById('fRole').value;
      if (!name) { toast('Name is required.', 'error'); return; }
      if (!isValidEmail(email)) { toast('Enter a valid email.', 'error'); return; }

      if (id) {
        DB.update(DB_KEYS.users, id, { name, email, role });
        addAuditLog(user.name, 'Updated user account', 'Users');
        toast('User updated successfully!', 'success');
      } else {
        DB.insert(DB_KEYS.users, { id: 'u-' + Date.now(), name, email, password: 'Welcome123!', role, status: 'Active', registered: today(), lastActivity: today() });
        addAuditLog(user.name, 'Created ' + role + ' account', 'Users');
        toast('User created successfully!', 'success');
      }
      closeModal('userModal');
      render();
    });

    ['uSearch', 'uRole', 'uStatus'].forEach(id => {
      document.getElementById(id).addEventListener('input', debounce(render, 150));
      document.getElementById(id).addEventListener('change', render);
    });
    render();
  }
</script>
</body>
</html>
