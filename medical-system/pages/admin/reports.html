<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Reports</h1><p id="pageSub">Appointments and absenteeism for any period (RF-32, RF-33).</p></div>
        
      </div>
      <div class="toolbar">
        <div class="form-group" style="margin:0;"><label for="rFrom" style="font-size:.8rem;">From</label><input type="date" id="rFrom"></div>
        <div class="form-group" style="margin:0;"><label for="rTo" style="font-size:.8rem;">To</label><input type="date" id="rTo"></div>
        <select class="filter-select" id="rSpec"><option value="">All specialties</option></select>
        <button class="btn btn-primary" id="rGo"><i class="fa-solid fa-chart-column"></i> Generate</button>
        <button class="btn btn-outline" id="rCsv"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
      </div>
      <div class="dashboard-grid" id="rStats"></div>
      <div class="two-col">
        <div class="card"><h4>Appointments by Status</h4><canvas id="rChart" height="220"></canvas></div>
        <div class="card"><h4>Absenteeism by Specialty</h4>
          <div class="table-wrap"><table class="data-table"><thead><tr><th>Specialty</th><th>Appointments</th><th>No-shows</th><th>%</th></tr></thead><tbody id="rBody"></tbody></table></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['admin']);
  if (user) {
    renderPortalLayout('reports.html');
    (async () => {
      try {

      const val = id => document.getElementById(id).value;
      const specs = await Api.especialidades.list();
      qs('#rSpec').innerHTML = '<option value="">All specialties</option>' + specs.map(s => `<option value="${s.idEspecialidad}">${esc(s.nombreEspecialidad)}</option>`).join('');
      const d = new Date(); qs('#rFrom').value = isoDate(new Date(d.getFullYear(), d.getMonth(), 1)); qs('#rTo').value = isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0));
      let chart, last = null;
      async function generate() {
        if (!val('rFrom') || !val('rTo') || val('rFrom') > val('rTo')) { toast('Check the date range.', 'error'); return; }
        const [rc, ri] = await Promise.all([Api.reportes.citas(val('rFrom'), val('rTo')), Api.reportes.inasistencia(val('rFrom'), val('rTo'), val('rSpec'))]);
        last = { rc, ri };
        const card = (icon, color, v, l) => `<div class="card stat-card"><div class="stat-icon ${color}"><i class="fa-solid ${icon}"></i></div><div><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div></div>`;
        qs('#rStats').innerHTML = card('fa-calendar', 'blue', rc.total, 'Total') + card('fa-circle-check', 'green', rc.atendidas, 'Completed') +
          card('fa-calendar-xmark', 'red', rc.canceladas, 'Cancelled') + card('fa-rotate', 'purple', rc.reprogramadas, 'Rescheduled') + card('fa-user-slash', 'amber', rc.noAsistio, 'No-shows');
        if (chart) chart.destroy();
        chart = new Chart(qs('#rChart'), { type: 'bar',
          data: { labels: ['Completed', 'Cancelled', 'Rescheduled', 'No-show'], datasets: [{ data: [rc.atendidas, rc.canceladas, rc.reprogramadas, rc.noAsistio], backgroundColor: ['#16a34a', '#dc2626', '#7c3aed', '#64767d'], borderRadius: 6 }] },
          options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } } });
        const filas = ri.filas || [];
        qs('#rBody').innerHTML = filas.length ? filas.map(f => `<tr><td>${esc(f.especialidad)}</td><td>${f.citasConsideradas}</td><td>${f.inasistencias}</td><td>${Number(f.porcentaje).toFixed(1)} %</td></tr>`).join('')
          : '<tr><td colspan="4" class="text-muted">No data for this range.</td></tr>';
      }
      qs('#rGo').addEventListener('click', () => safe(generate));
      qs('#rCsv').addEventListener('click', () => {
        if (!last) { toast('Generate the report first.', 'info'); return; }
        const { rc, ri } = last;
        const rows = [['Report', 'From', 'To'], ['Appointments', rc.desde, rc.hasta], [], ['Status', 'Count'], ['Total', rc.total], ['Completed', rc.atendidas], ['Cancelled', rc.canceladas], ['Rescheduled', rc.reprogramadas], ['No-show', rc.noAsistio], [],
          ['Specialty', 'Appointments considered', 'No-shows', 'Percentage'], ...(ri.filas || []).map(f => [f.especialidad, f.citasConsideradas, f.inasistencias, Number(f.porcentaje).toFixed(1)])];
        downloadFile(`report_${rc.desde}_${rc.hasta}.csv`, toCsv(rows));
      });
      await generate();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
