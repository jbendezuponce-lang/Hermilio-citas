<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a href="../../index.html" class="auth-brand"><i class="fa-solid fa-heart-pulse"></i> MediCare<em style="color:var(--color-primary);font-style:normal;">+</em></a>

    <!-- STEP 1: Email -->
    <div id="step1">
      <p class="auth-subtitle text-center">Enter your email and we'll send you a verification code.</p>
      <form id="emailForm" novalidate>
        <div class="form-group">
          <label for="fpEmail">Email <span class="req">*</span></label>
          <input type="email" id="fpEmail" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Send Verification Code</button>
      </form>
    </div>

    <!-- STEP 2: Code -->
    <div id="step2" style="display:none;">
      <p class="auth-subtitle text-center">Enter the 6-digit code we sent to your email. (Demo code: <strong>123456</strong>)</p>
      <form id="codeForm" novalidate>
        <div class="form-group">
          <label for="fpCode">Verification Code <span class="req">*</span></label>
          <input type="text" id="fpCode" maxlength="6" placeholder="123456">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Verify Code</button>
      </form>
    </div>

    <!-- STEP 3: New password -->
    <div id="step3" style="display:none;">
      <p class="auth-subtitle text-center">Set a new password for your account.</p>
      <form id="newPassForm" novalidate>
        <div class="form-group">
          <label for="fpPass1">New Password <span class="req">*</span></label>
          <input type="password" id="fpPass1" placeholder="Enter a new password">
        </div>
        <div class="form-group">
          <label for="fpPass2">Confirm Password <span class="req">*</span></label>
          <input type="password" id="fpPass2" placeholder="Repeat new password">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Reset Password</button>
      </form>
    </div>

    <!-- STEP 4: Success -->
    <div id="step4" style="display:none;text-align:center;">
      <div class="spec-icon" style="margin:0 auto 16px;background:#dcfce7;color:var(--color-success);"><i class="fa-solid fa-check"></i></div>
      <h3>Password Reset Successful</h3>
      <p>You can now log in with your new password.</p>
      <a href="login.html" class="btn btn-primary btn-block btn-lg">Back to Login</a>
    </div>

    <p class="text-center" style="font-size:.9rem;margin-top:18px;"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script>
  function showStep(n) {
    [1, 2, 3, 4].forEach(i => document.getElementById('step' + i).style.display = i === n ? 'block' : 'none');
  }

  document.getElementById('emailForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('fpEmail').value.trim();
    if (!isValidEmail(email)) { toast('Enter a valid email address.', 'error'); return; }
    toast('Verification code sent to your email (simulated).', 'info');
    showStep(2);
  });

  document.getElementById('codeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = document.getElementById('fpCode').value.trim();
    if (code !== '123456') { toast('Invalid verification code. Try 123456.', 'error'); return; }
    toast('Code verified!', 'success');
    showStep(3);
  });

  document.getElementById('newPassForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const p1 = document.getElementById('fpPass1').value;
    const p2 = document.getElementById('fpPass2').value;
    if (passwordStrength(p1) < 2) { toast('Password is too weak.', 'error'); return; }
    if (p1 !== p2) { toast('Passwords do not match.', 'error'); return; }
    showStep(4);
  });
</script>
</body>
</html>
