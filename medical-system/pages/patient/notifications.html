<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Notifications</h1><p id="pageSub">Confirmations, reminders and changes to your appointments.</p></div>
        
      </div>
<div id="nBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('notifications.html');
    (async () => {
      try {

      const box = qs('#nBox');
      const ICON = { CONFIRMACION: ['fa-circle-check', '#16a34a', 'Appointment confirmed'], RECORDATORIO: ['fa-bell', '#d97706', 'Appointment reminder'], REPROGRAMACION: ['fa-calendar-days', '#7c3aed', 'Appointment rescheduled'], CANCELACION: ['fa-calendar-xmark', '#dc2626', 'Appointment cancelled'] };
      let list = [];
      async function load() {
        list = await Api.notificaciones.mias();
        if (!list.length) { emptyState(box, 'fa-bell-slash', 'No notifications', "You're all caught up!"); return; }
        box.innerHTML = `<div class="card">${list.map(n => { const i = ICON[n.tipo] || ['fa-bell', '#64767d', n.tipo]; return `
          <div class="flex items-center gap-16" style="padding:14px 0;border-bottom:1px solid var(--color-border);${n.leido ? 'opacity:.7;' : ''}">
            <span class="stat-icon" style="width:42px;height:42px;background:${i[1]}22;color:${i[1]};"><i class="fa-solid ${i[0]}"></i></span>
            <div style="flex:1;"><div style="font-weight:600;">${esc(i[2])} ${n.leido ? '' : '<span class="badge badge-blue">New</span>'}</div><div class="text-muted" style="font-size:.88rem;">${esc(n.mensaje)}</div>
              <div class="text-muted" style="font-size:.78rem;">${formatDateTime(n.fechaEnvio)}</div></div>
            ${n.leido ? '' : `<button class="btn btn-outline btn-sm" data-id="${n.idNotificacion}">Mark as read</button>`}</div>`; }).join('')}</div>
          ${list.some(n => !n.leido) ? '<button class="btn btn-primary" id="readAll" style="margin-top:16px;">Mark all as read</button>' : ''}`;
      }
      box.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]');
        if (b) safe(async () => { await Api.notificaciones.leida(b.dataset.id); await load(); });
        if (e.target.closest('#readAll')) safe(async () => { for (const n of list.filter(x => !x.leido)) await Api.notificaciones.leida(n.idNotificacion); await load(); });
      });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
