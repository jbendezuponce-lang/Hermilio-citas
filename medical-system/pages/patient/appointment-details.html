<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Details | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Appointment Details</h1><p id="pageSub">Full information about your visit.</p></div>
        
      </div>
<div id="detBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('appointment-details.html');
    (async () => {
      try {

      const specIcon = (n) => { n = (n || '').toLowerCase(); return n.includes('psiq') ? 'fa-brain' : n.includes('psic') ? 'fa-comments' : n.includes('pedi') ? 'fa-child-reaching' : n.includes('cardi') ? 'fa-heart-pulse' : 'fa-stethoscope'; };
      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      const id = qparam('id'); const box = qs('#detBox');
      if (!id) { emptyState(box, 'fa-calendar-xmark', 'Appointment not found', 'Open an appointment from “My Appointments”.'); return; }
      const c = await Api.citas.obtener(id);
      qs('#pageTitle').textContent = 'Appointment #' + c.idCita;
      const editable = ['CONFIRMADA', 'REPROGRAMADA'].includes(c.estado) && c.fecha >= today();
      box.innerHTML = `<div class="card" style="max-width:760px;">
        <div class="flex items-center gap-16" style="margin-bottom:18px;"><span class="avatar-lg">${initials(c.medico)}</span>
          <div style="flex:1;"><h3 style="margin:0;">${esc(c.medico)}</h3><div class="text-muted">${esc(c.especialidad)}</div></div>${estadoBadge(c.estado)}</div>
        <table class="data-table" style="min-width:0;"><tbody>
          <tr><td style="font-weight:600;">Date</td><td>${formatDateLong(c.fecha)}</td></tr>
          <tr><td style="font-weight:600;">Time</td><td>${fmtTime(c.horaInicio)} – ${fmtTime(c.horaFin)}</td></tr>
          <tr><td style="font-weight:600;">Location</td><td><i class="fa-solid fa-location-dot"></i> ${esc(c.numeroPabellon)} · room ${esc(c.codigoRoom)}</td></tr>
          <tr><td style="font-weight:600;">Booked via</td><td>${c.origen === 'MOVIL' ? 'Mobile app / web' : 'Front desk'}</td></tr>
          <tr><td style="font-weight:600;">Booked on</td><td>${formatDateTime(c.fechaHoraReserva)}</td></tr>
          <tr><td style="font-weight:600;">Reschedules</td><td>${c.reprogramaciones}</td></tr></tbody></table>
        <div class="flex gap-12" style="margin-top:20px;flex-wrap:wrap;">
          <a href="appointments.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>
          ${editable ? `<a href="reschedule.html?id=${c.idCita}" class="btn btn-outline"><i class="fa-solid fa-calendar-days"></i> Reschedule</a><button class="btn btn-danger" id="cancelBtn"><i class="fa-solid fa-xmark"></i> Cancel appointment</button>` : ''}
        </div></div>`;
      qs('#cancelBtn')?.addEventListener('click', () => confirmDialog('Cancel this appointment?', () => safe(async () => {
        await Api.citas.cancelar(c.idCita); toast('Appointment cancelled.', 'success'); setTimeout(() => location.href = 'appointments.html', 800);
      }), { danger: true, confirmText: 'Cancel appointment' }));
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
