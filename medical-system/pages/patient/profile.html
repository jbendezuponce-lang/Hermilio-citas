<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Profile</h1><p id="pageSub">Keep your personal information up to date.</p></div>
        
      </div>
      <div class="card" style="max-width:760px;">
        <form id="pForm" novalidate>
          <div class="form-row">
            <div class="form-group"><label for="fNombres">First names <span class="req">*</span></label><input type="text" id="fNombres" maxlength="100"></div>
            <div class="form-group"><label for="fApellidos">Last names <span class="req">*</span></label><input type="text" id="fApellidos" maxlength="100"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="fDoc">Document ID</label><input type="text" id="fDoc" disabled></div>
            <div class="form-group"><label for="fCorreo">Email <span class="req">*</span></label><input type="email" id="fCorreo" maxlength="150"><div class="form-hint">If you change your email you will need to sign in again.</div></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label for="fTel">Phone</label><input type="tel" id="fTel" maxlength="20"></div>
            <div class="form-group"><label for="fSeguro">Insurance</label><input type="text" id="fSeguro" maxlength="50" placeholder="e.g. ESSALUD, SIS, Private"></div>
          </div>
          <div class="form-group"><label for="fApo">Guardian data (if applicable)</label><input type="text" id="fApo" maxlength="255"></div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('profile.html');
    (async () => {
      try {

      const val = id => document.getElementById(id).value.trim();
      const p = await Api.pacientes.me();
      qs('#fNombres').value = p.nombres; qs('#fApellidos').value = p.apellidos; qs('#fDoc').value = p.documentoIdentidad; qs('#fCorreo').value = p.correo;
      qs('#fTel').value = p.telefonoContacto || ''; qs('#fSeguro').value = p.tipoSeguro || ''; qs('#fApo').value = p.datosApoderado || '';
      qs('#pForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!val('fNombres') || !val('fApellidos')) { toast('First and last names are required.', 'error'); return; }
        if (!isValidEmail(val('fCorreo'))) { toast('Enter a valid email.', 'error'); return; }
        const cambiaCorreo = val('fCorreo').toLowerCase() !== p.correo.toLowerCase();
        await safe(async () => {
          await Api.pacientes.updateMe({ nombres: val('fNombres'), apellidos: val('fApellidos'), correo: val('fCorreo'), tipoSeguro: val('fSeguro') || null, telefonoContacto: val('fTel') || null, datosApoderado: val('fApo') || null });
          toast('Profile updated.', 'success');
          if (cambiaCorreo) setTimeout(() => Auth.logout(), 1500);
          else { const s = JSON.parse(localStorage.getItem('session')); s.name = val('fNombres') + ' ' + val('fApellidos'); localStorage.setItem('session', JSON.stringify(s)); }
        });
      });
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
