<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Welcome back!</h1><p id="pageSub">Here's what's happening with your health today.</p></div>
        <a href="book-appointment.html" class="btn btn-primary"><i class="fa-solid fa-calendar-plus"></i> Book Appointment</a>
      </div>
      <div class="dashboard-grid" id="statsGrid"></div>
      <div class="two-col">
        <div>
          <div class="card" style="margin-bottom:22px;">
            <div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Next Appointment</h4><a href="appointments.html" style="font-size:.85rem;font-weight:600;">View all</a></div>
            <div id="nextApptBox"></div>
          </div>
          <div class="card">
            <div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Recent Appointments</h4><a href="appointments.html" style="font-size:.85rem;font-weight:600;">View all</a></div>
            <div id="recentApptList"></div>
          </div>
        </div>
        <div>
          <div class="card" style="margin-bottom:22px;">
            <div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Notifications</h4><a href="notifications.html" style="font-size:.85rem;font-weight:600;">View all</a></div>
            <div id="notifList"></div>
          </div>
          <div class="card">
            <h4 style="margin-bottom:14px;">Quick Actions</h4>
            <div class="flex" style="flex-direction:column;gap:10px;">
              <a href="book-appointment.html" class="btn btn-outline btn-block"><i class="fa-solid fa-calendar-plus"></i> Book Appointment</a>
              <a href="appointments.html" class="btn btn-outline btn-block"><i class="fa-solid fa-calendar-check"></i> My Appointments</a>
              <a href="medical-history.html" class="btn btn-outline btn-block"><i class="fa-solid fa-file-waveform"></i> Medical History</a>
              <a href="documents.html" class="btn btn-outline btn-block"><i class="fa-solid fa-prescription-bottle-medical"></i> Prescriptions</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('dashboard.html');
    (async () => {
      try {

      const specIcon = (n) => { n = (n || '').toLowerCase(); return n.includes('psiq') ? 'fa-brain' : n.includes('psic') ? 'fa-comments' : n.includes('pedi') ? 'fa-child-reaching' : n.includes('cardi') ? 'fa-heart-pulse' : 'fa-stethoscope'; };
      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      qs('#pageTitle').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';
      qs('#pageSub').textContent = "Here's what's happening with your health today.";
      const [citas, notifs, hist] = await Promise.all([Api.citas.mias(), Api.notificaciones.mias(), Api.historiales.mios()]);
      const upcoming = citas.filter(c => ACTIVAS.includes(c.estado) && c.fecha >= today()).sort(sortCitas);
      const recetas = hist.reduce((n, h) => n + (h.recetas || []).length, 0);
      const card = (icon, color, v, l) => `<div class="card stat-card"><div class="stat-icon ${color}"><i class="fa-solid ${icon}"></i></div><div><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div></div>`;
      qs('#statsGrid').innerHTML = card('fa-calendar-check', 'blue', upcoming.length, 'Upcoming Appointments') +
        card('fa-circle-check', 'green', citas.filter(c => c.estado === 'ATENDIDA').length, 'Completed Appointments') +
        card('fa-file-waveform', 'teal', hist.length, 'Medical Records') + card('fa-prescription-bottle-medical', 'amber', recetas, 'Prescriptions');

      const next = upcoming[0], nextBox = qs('#nextApptBox');
      if (next) {
        nextBox.innerHTML = `
          <div class="flex items-center gap-16"><span class="avatar">${initials(next.medico)}</span>
            <div style="flex:1;"><strong>${esc(next.medico)}</strong><div class="text-muted" style="font-size:.85rem;">${esc(next.especialidad)}</div></div>${estadoBadge(next.estado)}</div>
          <div class="flex gap-16" style="margin-top:14px;flex-wrap:wrap;font-size:.88rem;color:var(--color-text-muted);">
            <span><i class="fa-solid fa-calendar-day"></i> ${formatDate(next.fecha)}</span>
            <span><i class="fa-solid fa-clock"></i> ${fmtTime(next.horaInicio)}</span>
            <span><i class="fa-solid fa-location-dot"></i> ${esc(next.numeroPabellon)} · ${esc(next.codigoRoom)}</span></div>
          <a href="appointment-details.html?id=${next.idCita}" class="btn btn-outline btn-sm" style="margin-top:14px;">View Details</a>`;
      } else emptyState(nextBox, 'fa-calendar-xmark', 'No upcoming appointments', "Book your next visit whenever you're ready.");

      const recent = [...citas].sort((a, b) => sortCitas(b, a)).slice(0, 4), rl = qs('#recentApptList');
      if (!recent.length) emptyState(rl, 'fa-calendar', 'No appointments yet', 'Your appointment history will appear here.');
      else rl.innerHTML = recent.map(a => `<div class="flex items-center justify-between" style="padding:12px 0;border-bottom:1px solid var(--color-border);">
          <div class="flex items-center gap-12"><span class="avatar-sm">${initials(a.medico)}</span><div><div style="font-weight:600;font-size:.9rem;">${esc(a.medico)}</div>
          <div class="text-muted" style="font-size:.8rem;">${formatDate(a.fecha)} · ${fmtTime(a.horaInicio)}</div></div></div>${estadoBadge(a.estado)}</div>`).join('');

      const nl = qs('#notifList'), top = notifs.slice(0, 4);
      if (!top.length) emptyState(nl, 'fa-bell-slash', 'No notifications', "You're all caught up!");
      else nl.innerHTML = top.map(n => `<div style="padding:10px 0;border-bottom:1px solid var(--color-border);">
          <div style="font-weight:600;font-size:.87rem;">${n.leido ? '' : '<i class="fa-solid fa-circle" style="font-size:6px;color:var(--color-primary);margin-right:6px;"></i>'}${esc(n.tipo)}</div>
          <div class="text-muted" style="font-size:.8rem;">${esc(n.mensaje)}</div></div>`).join('');
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
