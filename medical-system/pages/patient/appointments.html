<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Appointments | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Appointments</h1><p id="pageSub">View, reschedule or cancel your appointments.</p></div>
        <a href="book-appointment.html" class="btn btn-primary"><i class="fa-solid fa-calendar-plus"></i> Book Appointment</a>
      </div>
      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="aSearch" placeholder="Search by doctor or specialty..."></div>
        <select class="filter-select" id="aFilter"><option value="">All</option><option value="up">Upcoming</option><option value="past">Past</option><option value="CANCELADA">Cancelled</option></select>
      </div>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Doctor</th><th>Specialty</th><th>Date</th><th>Time</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="aBody"></tbody></table></div>
      <div id="aEmpty"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('appointments.html');
    (async () => {
      try {

      const specIcon = (n) => { n = (n || '').toLowerCase(); return n.includes('psiq') ? 'fa-brain' : n.includes('psic') ? 'fa-comments' : n.includes('pedi') ? 'fa-child-reaching' : n.includes('cardi') ? 'fa-heart-pulse' : 'fa-stethoscope'; };
      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      const body = qs('#aBody'), empty = qs('#aEmpty');
      let citas = [];
      async function load() { skeletonRows(body, 4, 7); citas = (await Api.citas.mias()).sort((a, b) => sortCitas(b, a)); render(); }
      function render() {
        const term = qs('#aSearch').value.toLowerCase().trim(), f = qs('#aFilter').value;
        const list = citas.filter(c => !term || (c.medico + ' ' + c.especialidad).toLowerCase().includes(term))
          .filter(c => !f || (f === 'up' ? ACTIVAS.includes(c.estado) && c.fecha >= today() : f === 'past' ? (c.fecha < today() || c.estado === 'ATENDIDA') && c.estado !== 'CANCELADA' : c.estado === f));
        if (!list.length) { body.innerHTML = ''; emptyState(empty, 'fa-calendar-xmark', 'No appointments found', 'Book your first appointment from “Book Appointment”.'); return; }
        empty.innerHTML = '';
        body.innerHTML = list.map(c => {
          const editable = ['CONFIRMADA', 'REPROGRAMADA'].includes(c.estado) && c.fecha >= today();
          return `<tr><td><div class="flex items-center gap-12"><span class="avatar-sm">${initials(c.medico)}</span><span>${esc(c.medico)}</span></div></td>
            <td>${esc(c.especialidad)}</td><td>${formatDate(c.fecha)}</td><td>${fmtTime(c.horaInicio)}</td><td>${esc(c.numeroPabellon)} · ${esc(c.codigoRoom)}</td><td>${estadoBadge(c.estado)}</td>
            <td class="table-actions"><a class="btn btn-outline btn-sm" href="appointment-details.html?id=${c.idCita}" data-tooltip="Details"><i class="fa-solid fa-eye"></i></a>
              ${editable ? `<a class="btn btn-outline btn-sm" href="reschedule.html?id=${c.idCita}" data-tooltip="Reschedule"><i class="fa-solid fa-calendar-days"></i></a>
              <button class="btn btn-danger btn-sm" data-id="${c.idCita}" data-tooltip="Cancel"><i class="fa-solid fa-xmark"></i></button>` : ''}</td></tr>`; }).join('');
      }
      body.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]'); if (!b) return;
        confirmDialog('Cancel this appointment? The time slot will be released immediately.', () => safe(async () => {
          await Api.citas.cancelar(b.dataset.id); toast('Appointment cancelled.', 'success'); await load();
        }), { danger: true, confirmText: 'Cancel appointment' });
      });
      qs('#aSearch').addEventListener('input', debounce(render, 150)); qs('#aFilter').addEventListener('change', render);
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
