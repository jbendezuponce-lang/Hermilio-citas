<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reschedule Appointment | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="breadcrumbs">
        <a href="appointments.html">My Appointments</a><span class="sep">/</span><span class="current">Reschedule</span>
      </div>
      <div id="rescheduleWrap"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('appointments.html');
    const id = new URLSearchParams(window.location.search).get('id');
    const appt = DB.find(DB_KEYS.appointments, id);
    const wrap = document.getElementById('rescheduleWrap');

    if (!appt || appt.patientId !== user.patientId) {
      emptyState(wrap, 'fa-calendar-xmark', 'Appointment not found', 'This appointment does not exist or is not yours.');
    } else {
      const doc = DB.find(DB_KEYS.doctors, appt.doctorId);
      let selectedDate = appt.date;
      let selectedTime = null;

      wrap.innerHTML = `
        <div class="card" style="max-width:640px;">
          <div class="flex items-center gap-12" style="margin-bottom:20px;">
            <img src="${doc.photo}" class="avatar" alt="Portrait of ${doc.name}">
            <div><strong>${doc.name}</strong><div class="text-muted" style="font-size:.85rem;">Current: ${formatDate(appt.date)} at ${appt.time}</div></div>
          </div>
          <div class="form-group" style="max-width:260px;">
            <label for="newDate">New Date</label>
            <input type="date" id="newDate" min="${today()}" value="${appt.date}">
          </div>
          <label>New Time</label>
          <div class="slot-grid" id="rescheduleSlots" style="margin-bottom:24px;"></div>
          <div class="flex gap-12">
            <button class="btn btn-primary" id="confirmReschedule">Confirm Change</button>
            <a href="appointments.html" class="btn btn-ghost">Cancel</a>
          </div>
        </div>`;

      function renderSlots() {
        const allSlots = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
        const taken = DB.get(DB_KEYS.appointments)
          .filter(a => a.doctorId === appt.doctorId && a.date === selectedDate && a.status !== 'Cancelled' && a.id !== appt.id)
          .map(a => a.time);
        document.getElementById('rescheduleSlots').innerHTML = allSlots.map(t => `
          <button type="button" class="slot-btn ${selectedTime === t ? 'selected' : ''}" data-time="${t}" ${taken.includes(t) ? 'disabled' : ''}>${t}</button>`).join('');
        qsa('#rescheduleSlots .slot-btn:not(:disabled)').forEach(btn => {
          btn.addEventListener('click', () => {
            qsa('#rescheduleSlots .slot-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTime = btn.dataset.time;
          });
        });
      }
      renderSlots();

      document.getElementById('newDate').addEventListener('input', (e) => {
        selectedDate = e.target.value;
        selectedTime = null;
        renderSlots();
      });

      document.getElementById('confirmReschedule').addEventListener('click', () => {
        if (!selectedDate || !selectedTime) { toast('Please select a date and time.', 'error'); return; }
        DB.update(DB_KEYS.appointments, appt.id, { date: selectedDate, time: selectedTime, status: 'Pending' });
        addNotification(user.id, 'Appointment rescheduled', `Your appointment with ${doc.name} was moved to ${formatDate(selectedDate)} at ${selectedTime}.`, 'appointment');
        addAuditLog(user.name, 'Rescheduled appointment', 'Appointments');
        toast('Appointment rescheduled successfully!', 'success');
        setTimeout(() => window.location.href = 'appointments.html', 900);
      });
    }
  }
</script>
</body>
</html>
