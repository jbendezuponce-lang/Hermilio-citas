<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reschedule Appointment | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Reschedule Appointment</h1><p id="pageSub">Pick another free time slot of the same specialty.</p></div>
        
      </div>
      <div class="card" style="max-width:900px;">
        <div id="curBox" style="margin-bottom:22px;"></div>
        <h3>Choose a new date</h3><div class="slot-grid" id="dateSlots"></div><p class="form-hint" id="dateHint"></p>
        <div id="timeWrap" style="display:none;margin-top:22px;"><h3>Choose a new time</h3><div id="timeSlots"></div></div>
        <div class="flex gap-12" style="margin-top:26px;"><a href="appointments.html" class="btn btn-ghost">Cancel</a><button class="btn btn-primary" id="confirmBtn" disabled><i class="fa-solid fa-check"></i> Confirm new time</button></div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('reschedule.html');
    (async () => {
      try {

      const specIcon = (n) => { n = (n || '').toLowerCase(); return n.includes('psiq') ? 'fa-brain' : n.includes('psic') ? 'fa-comments' : n.includes('pedi') ? 'fa-child-reaching' : n.includes('cardi') ? 'fa-heart-pulse' : 'fa-stethoscope'; };
      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      const id = qparam('id');
      if (!id) { emptyState(qs('#curBox'), 'fa-calendar-xmark', 'Appointment not found', 'Open it from “My Appointments”.'); return; }
      const c = await Api.citas.obtener(id);
      if (!['CONFIRMADA', 'REPROGRAMADA'].includes(c.estado)) { emptyState(qs('#curBox'), 'fa-ban', 'This appointment cannot be rescheduled', 'Only confirmed or rescheduled appointments can be moved.'); return; }
      qs('#curBox').innerHTML = `<div class="alert alert-info"><strong>Current appointment:</strong> ${esc(c.medico)} (${esc(c.especialidad)}) · ${formatDate(c.fecha)} at ${fmtTime(c.horaInicio)}</div>`;
      const slots = (await Api.horarios.disponibles(c.idEspecialidad)).filter(h => h.idHorario !== c.idHorario);
      let fecha = null, sel = null;
      const dates = [...new Set(slots.map(h => h.fecha))].sort();
      if (!dates.length) qs('#dateHint').textContent = 'There are no free slots for this specialty right now.';
      qs('#dateSlots').innerHTML = dates.map(d => `<button type="button" class="slot-btn" data-d="${d}">${new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</button>`).join('');
      qsa('#dateSlots .slot-btn').forEach(b => b.addEventListener('click', () => {
        qsa('#dateSlots .slot-btn').forEach(x => x.classList.remove('selected')); b.classList.add('selected'); fecha = b.dataset.d; sel = null; qs('#confirmBtn').disabled = true;
        qs('#timeWrap').style.display = 'block';
        qs('#timeSlots').innerHTML = `<div class="slot-grid">${slots.filter(h => h.fecha === fecha).map(h => `<button type="button" class="slot-btn" data-id="${h.idHorario}" title="${esc(h.medico)}">${fmtTime(h.horaInicio)} · ${esc(h.medico.split(' ')[0])}</button>`).join('')}</div>`;
        qsa('#timeSlots .slot-btn').forEach(t => t.addEventListener('click', () => { qsa('#timeSlots .slot-btn').forEach(x => x.classList.remove('selected')); t.classList.add('selected'); sel = t.dataset.id; qs('#confirmBtn').disabled = false; }));
      }));
      qs('#confirmBtn').addEventListener('click', () => safe(async () => {
        await Api.citas.reprogramar(c.idCita, Number(sel)); toast('Appointment rescheduled.', 'success'); setTimeout(() => location.href = 'appointments.html', 800);
      }));
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
