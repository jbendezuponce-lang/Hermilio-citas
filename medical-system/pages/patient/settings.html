<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Settings</h1><p id="pageSub">Account and security.</p></div>
        
      </div>
      <div class="card" style="max-width:760px;">
        <h4>Account</h4>
        <table class="data-table" style="min-width:0;"><tbody id="accBody"></tbody></table>
        <h4 style="margin-top:24px;">Security</h4>
        <p class="text-muted">To change your password, request a recovery link. For your safety, close your session when using a shared computer.</p>
        <div class="flex gap-12" style="flex-wrap:wrap;">
          <a href="../auth/forgot-password.html" class="btn btn-outline"><i class="fa-solid fa-key"></i> Reset password</a>
          <button class="btn btn-danger" id="outBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('settings.html');
    (async () => {
      try {

      const p = await Api.pacientes.me();
      qs('#accBody').innerHTML = `<tr><td style="font-weight:600;width:160px;">Name</td><td>${esc(fullName(p))}</td></tr>
        <tr><td style="font-weight:600;">Email</td><td>${esc(p.correo)}</td></tr><tr><td style="font-weight:600;">Document ID</td><td>${esc(p.documentoIdentidad)}</td></tr>
        <tr><td style="font-weight:600;">Role</td><td>${rolBadge('PACIENTE')}</td></tr>`;
      qs('#outBtn').addEventListener('click', () => Auth.logout());
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
