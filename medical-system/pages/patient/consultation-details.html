<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultation Details | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Consultation Details</h1><p id="pageSub">Diagnosis, treatment and prescriptions.</p></div>
        
      </div>
<div id="detBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('consultation-details.html');
    (async () => {
      try {

      const id = qparam('id'), box = qs('#detBox');
      const hist = await Api.historiales.mios();
      const h = hist.find(x => String(x.idHistorial) === String(id));
      if (!h) { emptyState(box, 'fa-file-circle-xmark', 'Record not found', 'Open it from your medical history.'); return; }
      qs('#pageTitle').textContent = 'Consultation of ' + formatDate(h.fechaCita);
      box.innerHTML = `<div class="card" style="max-width:820px;">
        <div class="flex justify-between items-center" style="margin-bottom:14px;"><div><h3 style="margin:0;">${esc(h.medico)}</h3><div class="text-muted">${esc(h.especialidad)}</div></div><span class="badge badge-green">Completed</span></div>
        <table class="data-table" style="min-width:0;"><tbody>
          <tr><td style="font-weight:600;width:170px;">Consultation date</td><td>${formatDateLong(h.fechaCita)}</td></tr>
          <tr><td style="font-weight:600;">Diagnosis</td><td>${esc(h.diagnostico || '—')}</td></tr>
          <tr><td style="font-weight:600;">Treatment / indications</td><td>${esc(h.tratamiento)}</td></tr>
          <tr><td style="font-weight:600;">Observations</td><td>${esc(h.observaciones || '—')}</td></tr>
          <tr><td style="font-weight:600;">Recorded on</td><td>${formatDateTime(h.fechaRegistro)}</td></tr></tbody></table>
        <h4 style="margin:20px 0 10px;">Prescriptions</h4>
        ${(h.recetas || []).length ? `<table class="data-table" style="min-width:0;"><thead><tr><th>Medication</th><th>Dose</th><th>Instructions</th></tr></thead><tbody>${h.recetas.map(r => `<tr><td>${esc(r.medicamento)}</td><td>${esc(r.dosis)}</td><td>${esc(r.indicaciones || '—')}</td></tr>`).join('')}</tbody></table>` : '<p class="text-muted">No prescriptions were issued.</p>'}
        <a href="medical-history.html" class="btn btn-ghost" style="margin-top:18px;"><i class="fa-solid fa-arrow-left"></i> Back to history</a></div>`;
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
