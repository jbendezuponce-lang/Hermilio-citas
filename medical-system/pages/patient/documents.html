<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescriptions | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Prescriptions</h1><p id="pageSub">Medication prescribed by your doctors.</p></div>
        
      </div>
<div id="docBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('documents.html');
    (async () => {
      try {

      const box = qs('#docBox');
      const hist = await Api.historiales.mios();
      const rows = hist.flatMap(h => (h.recetas || []).map(r => ({ ...r, fecha: h.fechaCita, medico: h.medico, idHistorial: h.idHistorial })));
      if (!rows.length) { emptyState(box, 'fa-prescription-bottle-medical', 'No prescriptions yet', 'Prescriptions issued by your doctors will appear here.'); return; }
      box.innerHTML = `<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Medication</th><th>Dose</th><th>Instructions</th><th>Doctor</th><th></th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${formatDate(r.fecha)}</td><td><strong>${esc(r.medicamento)}</strong></td><td>${esc(r.dosis)}</td><td>${esc(r.indicaciones || '—')}</td><td>${esc(r.medico)}</td>
          <td><a class="btn btn-outline btn-sm" href="consultation-details.html?id=${r.idHistorial}">Consultation</a></td></tr>`).join('')}</tbody></table></div>
        <button class="btn btn-outline" style="margin-top:16px;" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>`;
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
