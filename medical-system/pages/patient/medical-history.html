<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical History | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Medical History</h1><p id="pageSub">Your consultations, diagnoses and treatments.</p></div>
        
      </div>
      <div id="histBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['patient']);
  if (user) {
    renderPortalLayout('medical-history.html');
    (async () => {
      try {

      const box = qs('#histBox');
      const hist = await Api.historiales.mios();
      if (!hist.length) { emptyState(box, 'fa-file-waveform', 'No medical records yet', 'Your doctor will add a record after each consultation.'); return; }
      box.innerHTML = '<div class="timeline">' + hist.map(h => `
        <div class="timeline-item"><div class="timeline-date">${formatDate(h.fechaCita)}</div>
          <div class="card" style="margin-bottom:16px;">
            <div class="flex justify-between items-center" style="margin-bottom:8px;"><div><strong>${esc(h.medico)}</strong> <span class="text-muted">· ${esc(h.especialidad)}</span></div>
              <a class="btn btn-outline btn-sm" href="consultation-details.html?id=${h.idHistorial}">View details</a></div>
            <p style="margin:6px 0;"><strong>Diagnosis:</strong> ${esc(h.diagnostico || '—')}</p>
            <p style="margin:6px 0;"><strong>Treatment:</strong> ${esc(h.tratamiento)}</p>
            ${(h.recetas || []).length ? `<p style="margin:6px 0;"><strong>Prescriptions:</strong> ${h.recetas.map(r => esc(r.medicamento) + ' (' + esc(r.dosis) + ')').join(', ')}</p>` : ''}
          </div></div>`).join('') + '</div>';
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
