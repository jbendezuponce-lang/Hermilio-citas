<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Patients</h1><p id="pageSub">Register new patients and look them up by document ID (RF-17, RF-18).</p></div>
        <button class="btn btn-primary" id="newBtn"><i class="fa-solid fa-user-plus"></i> Register patient</button>
      </div>
      <div class="card" style="max-width:760px;margin-bottom:22px;"><h4>Find a patient</h4>
        <div class="flex gap-8"><input type="text" id="sDoc" maxlength="15" placeholder="Document ID" style="flex:1;"><button class="btn btn-primary" id="sGo"><i class="fa-solid fa-magnifying-glass"></i> Search</button></div></div>
      <div id="result"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="regModal">
  <div class="modal-box modal-lg">
    <div class="modal-header"><h3 id="regTitle">Register patient</h3><button class="modal-close" onclick="closeModal('regModal')">&times;</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label for="rNom">First names <span class="req">*</span></label><input type="text" id="rNom" maxlength="100"></div>
        <div class="form-group"><label for="rApe">Last names <span class="req">*</span></label><input type="text" id="rApe" maxlength="100"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="rDoc">Document ID (8-15) <span class="req">*</span></label><input type="text" id="rDoc" maxlength="15"></div>
        <div class="form-group"><label for="rCorreo">Email <span class="req">*</span></label><input type="email" id="rCorreo" maxlength="150"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="rTel">Phone</label><input type="tel" id="rTel" maxlength="20"></div>
        <div class="form-group"><label for="rSeg">Insurance</label><input type="text" id="rSeg" maxlength="50"></div>
      </div>
      <div class="form-group"><label for="rApo">Guardian data</label><input type="text" id="rApo" maxlength="255"></div>
      <div class="form-group"><label for="rPass">Password (optional)</label><input type="password" id="rPass" maxlength="72" autocomplete="new-password"><div class="form-hint">If left empty, the patient sets one with “Forgot password”.</div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('regModal')">Cancel</button>
      <button class="btn btn-primary" id="rSave">Register</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('patients.html');
    (async () => {
      try {

      const val = id => document.getElementById(id).value.trim();
      const show = (p) => qs('#result').innerHTML = `<div class="card" style="max-width:760px;"><div class="flex items-center gap-16" style="margin-bottom:14px;"><span class="avatar-lg">${initials(fullName(p))}</span><div><h3 style="margin:0;">${esc(fullName(p))}</h3><div class="text-muted">Document ${esc(p.documentoIdentidad)}</div></div></div>
        <table class="data-table" style="min-width:0;"><tbody><tr><td style="font-weight:600;width:160px;">Email</td><td>${esc(p.correo)}</td></tr><tr><td style="font-weight:600;">Phone</td><td>${esc(p.telefonoContacto || '—')}</td></tr>
        <tr><td style="font-weight:600;">Insurance</td><td>${esc(p.tipoSeguro || '—')}</td></tr><tr><td style="font-weight:600;">Guardian data</td><td>${esc(p.datosApoderado || '—')}</td></tr></tbody></table>
        <a href="appointments.html" class="btn btn-outline" style="margin-top:16px;"><i class="fa-solid fa-calendar-plus"></i> Go to appointments</a></div>`;
      async function search() {
        const d = val('sDoc'); if (!d) { toast('Enter a document ID.', 'error'); return; }
        try { show(await Api.pacientes.buscar(d)); }
        catch (e) { if (e.status === 404) emptyState(qs('#result'), 'fa-user-slash', 'Patient not found', 'No patient is registered with that document ID. You can register a new one.'); else throw e; }
      }
      qs('#sGo').addEventListener('click', () => safe(search));
      qs('#sDoc').addEventListener('keydown', (e) => { if (e.key === 'Enter') safe(search); });
      qs('#newBtn').addEventListener('click', () => { ['rNom', 'rApe', 'rDoc', 'rCorreo', 'rTel', 'rSeg', 'rApo', 'rPass'].forEach(i => document.getElementById(i).value = ''); qs('#rDoc').value = val('sDoc'); openModal('regModal'); });
      qs('#rSave').addEventListener('click', () => safe(async () => {
        if (!val('rNom') || !val('rApe')) { toast('First and last names are required.', 'error'); return; }
        if (val('rDoc').length < 8) { toast('Document ID must have 8 to 15 characters.', 'error'); return; }
        if (!isValidEmail(val('rCorreo'))) { toast('Enter a valid email.', 'error'); return; }
        const pass = qs('#rPass').value;
        const p = await Api.pacientes.registrar({ documentoIdentidad: val('rDoc'), nombres: val('rNom'), apellidos: val('rApe'), correo: val('rCorreo'), password: pass || null, tipoSeguro: val('rSeg') || null, telefonoContacto: val('rTel') || null, datosApoderado: val('rApo') || null });
        toast('Patient registered and saved in the database.', 'success'); closeModal('regModal'); show(p);
      }));
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
