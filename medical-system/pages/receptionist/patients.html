<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1>Patients</h1><p>Search, create and manage patient records.</p></div>
        <button class="btn btn-primary" id="newPatientBtn"><i class="fa-solid fa-user-plus"></i> Create Patient</button>
      </div>

      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="pSearch" placeholder="Search by name, National ID, email..."></div>
        <select class="filter-select" id="pStatus"><option value="">All Statuses</option><option>Active</option><option>Inactive</option></select>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Patient</th><th>National ID</th><th>Phone</th><th>Email</th><th>Registered</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="pBody"></tbody>
        </table>
      </div>
      <div id="pEmpty"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="patientModal">
  <div class="modal-box modal-lg">
    <div class="modal-header"><h3 id="modalTitle">Create Patient</h3><button class="modal-close" onclick="closeModal('patientModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-row">
        <div class="form-group"><label for="fName">Full Name</label><input type="text" id="fName"></div>
        <div class="form-group"><label for="fNationalId">National ID</label><input type="text" id="fNationalId"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="fPhone">Phone</label><input type="tel" id="fPhone"></div>
        <div class="form-group"><label for="fEmail">Email</label><input type="email" id="fEmail"></div>
      </div>
      <div class="form-group"><label for="fAddress">Address</label><input type="text" id="fAddress"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('patientModal')">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Patient</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('patients.html');

    function render() {
      const term = document.getElementById('pSearch').value.toLowerCase().trim();
      const status = document.getElementById('pStatus').value;
      const list = DB.get(DB_KEYS.patients)
        .filter(p => !status || p.status === status)
        .filter(p => !term || p.name.toLowerCase().includes(term) || p.nationalId.includes(term) || p.email.toLowerCase().includes(term));

      const body = document.getElementById('pBody');
      const empty = document.getElementById('pEmpty');
      if (list.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-users', 'No patients found', 'Try a different search or create a new patient.'); return; }
      empty.innerHTML = '';
      body.innerHTML = list.map(p => `
        <tr>
          <td><div class="flex items-center gap-12"><img src="${p.photo}" class="avatar" style="width:34px;height:34px;" alt=""><span>${p.name}</span></div></td>
          <td>${p.nationalId}</td>
          <td>${p.phone}</td>
          <td>${p.email}</td>
          <td>${formatDate(p.registered)}</td>
          <td>${statusBadge(p.status)}</td>
          <td class="table-actions">
            <button class="btn btn-outline btn-sm edit-btn" data-id="${p.id}" data-tooltip="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-outline btn-sm toggle-btn" data-id="${p.id}" data-tooltip="${p.status === 'Active' ? 'Deactivate' : 'Activate'}"><i class="fa-solid ${p.status === 'Active' ? 'fa-user-slash' : 'fa-user-check'}"></i></button>
          </td>
        </tr>`).join('');

      qsa('.edit-btn').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.id)));
      qsa('.toggle-btn').forEach(b => b.addEventListener('click', () => {
        const p = DB.find(DB_KEYS.patients, b.dataset.id);
        const newStatus = p.status === 'Active' ? 'Inactive' : 'Active';
        DB.update(DB_KEYS.patients, p.id, { status: newStatus });
        addAuditLog(user.name, (newStatus === 'Active' ? 'Activated' : 'Deactivated') + ' patient', 'Patients');
        toast(`Patient ${newStatus === 'Active' ? 'activated' : 'deactivated'}.`, 'success');
        render();
      }));
    }

    function openEdit(id) {
      const p = DB.find(DB_KEYS.patients, id);
      document.getElementById('modalTitle').textContent = 'Edit Patient';
      document.getElementById('editId').value = id;
      document.getElementById('fName').value = p.name;
      document.getElementById('fNationalId').value = p.nationalId;
      document.getElementById('fPhone').value = p.phone;
      document.getElementById('fEmail').value = p.email;
      document.getElementById('fAddress').value = p.address;
      openModal('patientModal');
    }

    document.getElementById('newPatientBtn').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = 'Create Patient';
      ['editId', 'fName', 'fNationalId', 'fPhone', 'fEmail', 'fAddress'].forEach(id => document.getElementById(id).value = '');
      openModal('patientModal');
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const id = document.getElementById('editId').value;
      const name = document.getElementById('fName').value.trim();
      const email = document.getElementById('fEmail').value.trim();
      const phone = document.getElementById('fPhone').value.trim();
      if (!name) { toast('Name is required.', 'error'); return; }
      if (!isValidEmail(email)) { toast('Enter a valid email.', 'error'); return; }
      if (!isValidPhone(phone)) { toast('Enter a valid phone.', 'error'); return; }

      const data = { name, nationalId: document.getElementById('fNationalId').value.trim(), phone, email, address: document.getElementById('fAddress').value.trim() };

      if (id) {
        DB.update(DB_KEYS.patients, id, data);
        addAuditLog(user.name, 'Updated patient information', 'Patients');
        toast('Patient updated successfully!', 'success');
      } else {
        const newId = 'pat-' + Date.now().toString().slice(-6);
        DB.insert(DB_KEYS.patients, { id: newId, userId: null, ...data, dob: '', gender: '', photo: `https://i.pravatar.cc/300?img=${Math.floor(Math.random()*60)+1}`, registered: today(), status: 'Active', allergies: ['Not specified'], bloodType: 'Unknown' });
        addAuditLog(user.name, 'Created patient record', 'Patients');
        toast('Patient created successfully!', 'success');
      }
      closeModal('patientModal');
      render();
    });

    ['pSearch', 'pStatus'].forEach(id => {
      document.getElementById(id).addEventListener('input', debounce(render, 150));
      document.getElementById(id).addEventListener('change', render);
    });
    render();
  }
</script>
</body>
</html>
