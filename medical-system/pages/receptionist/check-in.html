<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Patient Check-in</h1><p id="pageSub">Confirm the arrival of today's patients (RF-23).</p></div>
        
      </div>
      <div class="toolbar"><div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="cSearch" placeholder="Search by patient name or document..."></div><button class="btn btn-outline" id="cReload"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Patient</th><th>Document</th><th>Doctor</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="cBody"></tbody></table></div>
      <div id="cEmpty"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('check-in.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      const body = qs('#cBody'), empty = qs('#cEmpty');
      let citas = [];
      async function load() { skeletonRows(body, 4, 7); citas = (await Api.citas.agenda(today())).sort(sortCitas); render(); }
      function render() {
        const term = qs('#cSearch').value.toLowerCase().trim();
        const list = citas.filter(c => !term || (c.paciente + ' ' + c.documentoPaciente).toLowerCase().includes(term));
        if (!list.length) { body.innerHTML = ''; emptyState(empty, 'fa-clipboard-check', 'No patients to check in', 'There are no appointments for today.'); return; }
        empty.innerHTML = '';
        body.innerHTML = list.map(c => `<tr><td>${fmtTime(c.horaInicio)}</td><td>${esc(c.paciente)}</td><td>${esc(c.documentoPaciente)}</td><td>${esc(c.medico)}</td><td>${esc(c.numeroPabellon)} · ${esc(c.codigoRoom)}</td><td>${estadoBadge(c.estado)}</td>
          <td class="table-actions">${['CONFIRMADA', 'REPROGRAMADA'].includes(c.estado) ? `<button class="btn btn-success btn-sm" data-id="${c.idCita}"><i class="fa-solid fa-clipboard-check"></i> Check-in</button>` : ''}</td></tr>`).join('');
      }
      body.addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) safe(async () => { await Api.citas.checkIn(b.dataset.id); toast('Patient checked in.', 'success'); await load(); }); });
      qs('#cSearch').addEventListener('input', debounce(render, 150)); qs('#cReload').addEventListener('click', () => safe(load));
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
