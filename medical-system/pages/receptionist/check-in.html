<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header"><div><h1>Patient Check-in</h1><p>Track patient arrival through the visit workflow.</p></div></div>

      <div class="grid grid-4" style="margin-bottom:22px;">
        <div class="card text-center" style="padding:16px;"><div class="badge badge-blue" style="margin-bottom:6px;">Confirmed</div><p class="text-muted" style="font-size:.8rem;margin:0;">Appointment booked</p></div>
        <div class="card text-center" style="padding:16px;"><div class="badge badge-purple" style="margin-bottom:6px;">Waiting</div><p class="text-muted" style="font-size:.8rem;margin:0;">Checked in, waiting room</p></div>
        <div class="card text-center" style="padding:16px;"><div class="badge badge-teal" style="margin-bottom:6px;">In Consultation</div><p class="text-muted" style="font-size:.8rem;margin:0;">With the doctor</p></div>
        <div class="card text-center" style="padding:16px;"><div class="badge badge-green" style="margin-bottom:6px;">Completed</div><p class="text-muted" style="font-size:.8rem;margin:0;">Visit finished</p></div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Patient</th><th>Doctor</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="ciBody"></tbody>
        </table>
      </div>
      <div id="ciEmpty"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('check-in.html');
    const patients = Object.fromEntries(DB.get(DB_KEYS.patients).map(p => [p.id, p]));
    const doctors = Object.fromEntries(DB.get(DB_KEYS.doctors).map(d => [d.id, d]));
    const FLOW = ['Confirmed', 'Waiting', 'In Consultation', 'Completed'];

    function render() {
      const list = DB.get(DB_KEYS.appointments).filter(a => a.date === today() && a.status !== 'Cancelled' && a.status !== 'Pending').sort((a, b) => a.time.localeCompare(b.time));
      const body = document.getElementById('ciBody');
      const empty = document.getElementById('ciEmpty');
      if (list.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-clipboard-check', 'No arrivals today', 'Confirmed appointments for today will appear here.'); return; }
      empty.innerHTML = '';
      body.innerHTML = list.map(a => {
        const p = patients[a.patientId]; const d = doctors[a.doctorId];
        const idx = FLOW.indexOf(a.status);
        const next = FLOW[idx + 1];
        return `<tr>
          <td><div class="flex items-center gap-12"><img src="${p.photo}" class="avatar" style="width:34px;height:34px;" alt=""><span>${p.name}</span></div></td>
          <td>${d.name}</td>
          <td>${a.time}</td>
          <td>${statusBadge(a.status)}</td>
          <td class="table-actions">
            ${next ? `<button class="btn btn-primary btn-sm advance-btn" data-id="${a.id}" data-next="${next}">Move to "${next}"</button>` : `<span class="text-muted" style="font-size:.82rem;">Visit complete</span>`}
          </td>
        </tr>`;
      }).join('');

      qsa('.advance-btn').forEach(b => b.addEventListener('click', () => {
        DB.update(DB_KEYS.appointments, b.dataset.id, { status: b.dataset.next });
        addAuditLog(user.name, `Updated appointment status to ${b.dataset.next}`, 'Check-in');
        toast(`Status updated to "${b.dataset.next}".`, 'success');
        render();
      }));
    }
    render();
  }
</script>
</body>
</html>
