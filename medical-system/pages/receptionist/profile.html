<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Profile</h1><p id="pageSub">Your account information.</p></div>
        
      </div>
<div class="card" style="max-width:640px;"><table class="data-table" style="min-width:0;"><tbody id="pBody"></tbody></table><p class="text-muted" style="margin-top:14px;">To change your data, ask an administrator (Users).</p></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('profile.html');
    (async () => {
      try {
      qs('#pBody').innerHTML = `<tr><td style="font-weight:600;width:150px;">Name</td><td>${esc(user.name)}</td></tr><tr><td style="font-weight:600;">Email</td><td>${esc(user.email)}</td></tr><tr><td style="font-weight:600;">Role</td><td>${rolBadge(user.rol)}</td></tr>`;
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
