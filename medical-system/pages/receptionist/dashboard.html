<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Welcome back!</h1><p id="pageSub">Today's front-desk overview.</p></div>
        
      </div>
      <div class="dashboard-grid" id="statsGrid"></div>
      <div class="card"><div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Today's Appointments</h4><a href="appointments.html" style="font-size:.85rem;font-weight:600;">Manage</a></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Specialty</th><th>Status</th></tr></thead><tbody id="tBody"></tbody></table></div><div id="tEmpty"></div></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['receptionist']);
  if (user) {
    renderPortalLayout('dashboard.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);
      const ACTIVAS = ['CONFIRMADA', 'REPROGRAMADA', 'CHECK_IN'];

      qs('#pageTitle').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';
      qs('#pageSub').textContent = "Today's front-desk overview.";
      const [citas, espera] = await Promise.all([Api.citas.agenda(today()), Api.listaEspera.list()]);
      const n = e => citas.filter(c => c.estado === e).length;
      const card = (icon, color, v, l) => `<div class="card stat-card"><div class="stat-icon ${color}"><i class="fa-solid ${icon}"></i></div><div><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div></div>`;
      qs('#statsGrid').innerHTML = card('fa-calendar-day', 'blue', citas.length, "Today's Appointments") + card('fa-clipboard-check', 'teal', n('CHECK_IN'), 'Checked in') +
        card('fa-circle-check', 'green', n('ATENDIDA'), 'Completed') + card('fa-hourglass-half', 'amber', espera.filter(w => w.estado === 'EN_ESPERA').length, 'On waiting list');
      const list = [...citas].sort(sortCitas);
      if (!list.length) emptyState(qs('#tEmpty'), 'fa-calendar', 'No appointments today', 'Nothing is scheduled for today.');
      else qs('#tBody').innerHTML = list.map(c => `<tr><td>${fmtTime(c.horaInicio)}</td><td>${esc(c.paciente)}</td><td>${esc(c.medico)}</td><td>${esc(c.especialidad)}</td><td>${estadoBadge(c.estado)}</td></tr>`).join('');
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
