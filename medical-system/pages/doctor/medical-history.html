<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical History | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header"><div><h1>Medical History</h1><p>All consultations you've registered.</p></div></div>
      <div class="toolbar">
        <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="hSearch" placeholder="Search by patient name..."></div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Date</th><th>Patient</th><th>Diagnosis</th><th>Treatment</th><th>Actions</th></tr></thead>
          <tbody id="hBody"></tbody>
        </table>
      </div>
      <div id="hEmpty"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="viewModal">
  <div class="modal-box modal-lg">
    <div class="modal-header"><h3>Consultation Details</h3><button class="modal-close" onclick="closeModal('viewModal')">&times;</button></div>
    <div class="modal-body" id="viewModalBody"></div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('medical-history.html');
    const patients = Object.fromEntries(DB.get(DB_KEYS.patients).map(p => [p.id, p]));
    const consultations = DB.get(DB_KEYS.consultations).filter(c => c.doctorId === user.doctorId).sort((a, b) => b.date.localeCompare(a.date));

    function render() {
      const term = document.getElementById('hSearch').value.toLowerCase().trim();
      const filtered = consultations.filter(c => !term || patients[c.patientId]?.name.toLowerCase().includes(term));
      const body = document.getElementById('hBody');
      const empty = document.getElementById('hEmpty');
      if (filtered.length === 0) { body.innerHTML = ''; emptyState(empty, 'fa-file-waveform', 'No records found', 'Registered consultations will appear here.'); return; }
      empty.innerHTML = '';
      body.innerHTML = filtered.map(c => `
        <tr>
          <td>${formatDate(c.date)}</td>
          <td>${patients[c.patientId]?.name || '—'}</td>
          <td>${c.diagnosis}</td>
          <td>${c.treatment}</td>
          <td><button class="btn btn-outline btn-sm view-btn" data-id="${c.id}"><i class="fa-solid fa-eye"></i> View</button></td>
        </tr>`).join('');

      qsa('.view-btn').forEach(btn => btn.addEventListener('click', () => {
        const c = consultations.find(x => x.id === btn.dataset.id);
        document.getElementById('viewModalBody').innerHTML = `
          <p><strong>Patient:</strong> ${patients[c.patientId]?.name}</p>
          <p><strong>Reason:</strong> ${c.reason}</p>
          <p><strong>Diagnosis:</strong> ${c.diagnosis}</p>
          <p><strong>Treatment:</strong> ${c.treatment}</p>
          <p><strong>Medications:</strong> ${c.medications.join(', ') || 'None'}</p>
          <p><strong>Recommendations:</strong> ${c.recommendations}</p>`;
        openModal('viewModal');
      }));
    }
    document.getElementById('hSearch').addEventListener('input', debounce(render, 150));
    render();
  }
</script>
</body>
</html>
