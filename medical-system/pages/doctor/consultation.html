<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Consultation | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header"><div><h1>Register Consultation</h1><p>Document a clinical visit and update the patient's medical history.</p></div></div>

      <form id="consultForm" class="card" style="max-width:820px;" novalidate>
        <div class="form-group">
          <label for="patientSelect">Patient <span class="req">*</span></label>
          <select id="patientSelect"><option value="">Select a patient...</option></select>
        </div>
        <div class="form-group"><label for="reason">Reason for Consultation <span class="req">*</span></label><textarea id="reason" placeholder="e.g. Follow-up on hypertension"></textarea></div>
        <div class="form-group"><label for="symptoms">Symptoms</label><textarea id="symptoms" placeholder="Describe reported symptoms"></textarea></div>

        <h4 style="margin-top:10px;">Vital Signs</h4>
        <div class="grid grid-3">
          <div class="form-group"><label for="weight">Weight</label><input type="text" id="weight" placeholder="e.g. 78 kg"></div>
          <div class="form-group"><label for="height">Height</label><input type="text" id="height" placeholder="e.g. 176 cm"></div>
          <div class="form-group"><label for="bp">Blood Pressure</label><input type="text" id="bp" placeholder="e.g. 120/80"></div>
          <div class="form-group"><label for="temp">Temperature</label><input type="text" id="temp" placeholder="e.g. 36.6°C"></div>
          <div class="form-group"><label for="hr">Heart Rate</label><input type="text" id="hr" placeholder="e.g. 72 bpm"></div>
          <div class="form-group"><label for="spo2">Oxygen Saturation</label><input type="text" id="spo2" placeholder="e.g. 98%"></div>
        </div>

        <div class="form-group"><label for="exam">Clinical Examination</label><textarea id="exam" placeholder="Examination findings"></textarea></div>
        <div class="form-group"><label for="diagnosis">Diagnosis <span class="req">*</span></label><textarea id="diagnosis" placeholder="Clinical diagnosis"></textarea></div>
        <div class="form-group"><label for="treatment">Treatment <span class="req">*</span></label><textarea id="treatment" placeholder="Recommended treatment plan"></textarea></div>
        <div class="form-group"><label for="medications">Medications (one per line)</label><textarea id="medications" placeholder="e.g. Amoxicillin 500mg — 3x daily for 7 days"></textarea></div>
        <div class="form-group"><label for="recommendations">Recommendations</label><textarea id="recommendations" placeholder="Lifestyle or follow-up recommendations"></textarea></div>
        <div class="form-group"><label for="notes">Additional Notes</label><textarea id="notes" placeholder="Any additional notes"></textarea></div>
        <div class="form-group" style="max-width:260px;"><label for="followUp">Next Appointment (optional)</label><input type="date" id="followUp"></div>

        <div class="flex gap-12" style="margin-top:10px;">
          <button type="button" class="btn btn-ghost" id="saveDraftBtn">Save Draft</button>
          <button type="submit" class="btn btn-primary">Save Consultation</button>
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('consultation.html');
    document.getElementById('followUp').min = today();

    const appts = DB.get(DB_KEYS.appointments).filter(a => a.doctorId === user.doctorId);
    const patientIds = [...new Set(appts.map(a => a.patientId))];
    const patients = DB.get(DB_KEYS.patients).filter(p => patientIds.includes(p.id));
    const select = document.getElementById('patientSelect');
    select.innerHTML += patients.map(p => `<option value="${p.id}">${p.name} (${p.id})</option>`).join('');

    const preselect = new URLSearchParams(window.location.search).get('patient');
    if (preselect) select.value = preselect;

    document.getElementById('saveDraftBtn').addEventListener('click', () => toast('Draft saved locally.', 'info'));

    document.getElementById('consultForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const patientId = select.value;
      const reason = document.getElementById('reason').value.trim();
      const diagnosis = document.getElementById('diagnosis').value.trim();
      const treatment = document.getElementById('treatment').value.trim();

      if (!patientId) { toast('Please select a patient.', 'error'); return; }
      if (!reason) { toast('Please enter a reason for the consultation.', 'error'); return; }
      if (!diagnosis) { toast('Please enter a diagnosis.', 'error'); return; }
      if (!treatment) { toast('Please enter a treatment plan.', 'error'); return; }

      const patient = DB.find(DB_KEYS.patients, patientId);
      const consultation = {
        id: 'CON-' + Math.floor(600 + Math.random() * 9000),
        patientId, doctorId: user.doctorId, specialtyId: DB.find(DB_KEYS.doctors, user.doctorId).specialtyId,
        date: today(), reason, symptoms: document.getElementById('symptoms').value.trim() || 'Not reported',
        vitals: {
          weight: document.getElementById('weight').value || '—', height: document.getElementById('height').value || '—',
          bp: document.getElementById('bp').value || '—', temp: document.getElementById('temp').value || '—',
          hr: document.getElementById('hr').value || '—', spo2: document.getElementById('spo2').value || '—'
        },
        diagnosis, treatment,
        medications: document.getElementById('medications').value.split('\n').map(m => m.trim()).filter(Boolean),
        recommendations: document.getElementById('recommendations').value.trim() || 'None',
        notes: document.getElementById('notes').value.trim() || '—',
        followUp: document.getElementById('followUp').value || null
      };
      DB.insert(DB_KEYS.consultations, consultation);

      // Mark a matching appointment as completed if one exists today
      const matchingAppt = appts.find(a => a.patientId === patientId && a.date === today() && a.status !== 'Completed' && a.status !== 'Cancelled');
      if (matchingAppt) DB.update(DB_KEYS.appointments, matchingAppt.id, { status: 'Completed' });

      if (patient.userId) {
        addNotification(patient.userId, 'Doctor updated medical record', `${user.name} added a new consultation to your medical history.`, 'document');
      }
      addAuditLog(user.name, 'Registered consultation', 'Medical Records');
      toast('Consultation saved successfully!', 'success');
      setTimeout(() => window.location.href = 'patient-profile.html?id=' + patientId, 900);
    });
  }
</script>
</body>
</html>
