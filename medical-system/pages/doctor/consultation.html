<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Consultation | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Register Consultation</h1><p id="pageSub">Triage, diagnosis, treatment and prescriptions (RF-29, RF-30).</p></div>
        
      </div>
      <div id="pickBox"></div>
      <div id="consBox" style="display:none;">
        <div class="alert alert-info" id="consInfo"></div>
        <div class="card" style="max-width:900px;margin-bottom:22px;"><h4>Triage (optional)</h4>
          <div class="form-row">
            <div class="form-group"><label for="tPa">Blood pressure</label><input type="text" id="tPa" placeholder="120/80" maxlength="7"></div>
            <div class="form-group"><label for="tPeso">Weight (kg)</label><input type="number" id="tPeso" step="0.1" min="0.5" max="500"></div>
          </div>
          <div class="form-group"><label for="tSv">Vital signs</label><input type="text" id="tSv" maxlength="255" placeholder="Temp 36.6 °C, HR 72 bpm, SpO2 98%"></div></div>
        <div class="card" style="max-width:900px;margin-bottom:22px;"><h4>Clinical record</h4>
          <div class="form-group"><label for="cDx">Diagnosis</label><textarea id="cDx" rows="2"></textarea></div>
          <div class="form-group"><label for="cTx">Treatment / indications <span class="req">*</span></label><textarea id="cTx" rows="3"></textarea></div>
          <div class="form-group"><label for="cObs">Observations</label><textarea id="cObs" rows="2"></textarea></div></div>
        <div class="card" style="max-width:900px;margin-bottom:22px;"><div class="flex justify-between items-center"><h4 style="margin:0;">Prescriptions</h4><button class="btn btn-outline btn-sm" id="addRx" type="button"><i class="fa-solid fa-plus"></i> Add medication</button></div><div id="rxBox" style="margin-top:12px;"></div></div>
        <button class="btn btn-primary btn-lg" id="saveCons"><i class="fa-solid fa-check"></i> Save and complete consultation</button>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('consultation.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      const cid = qparam('cita');
      if (!cid) {
        const list = (await Api.citas.miAgenda(today())).filter(c => c.estado === 'CHECK_IN').sort(sortCitas);
        if (!list.length) { emptyState(qs('#pickBox'), 'fa-notes-medical', 'No patients waiting', 'Patients appear here after the front desk registers their check-in.'); return; }
        qs('#pickBox').innerHTML = '<h3>Patients waiting</h3>' + list.map(c => `<div class="card" style="margin-bottom:12px;max-width:760px;"><div class="flex items-center justify-between"><div><strong>${esc(c.paciente)}</strong><div class="text-muted" style="font-size:.85rem;">${fmtTime(c.horaInicio)} · ${esc(c.especialidad)} · ${esc(c.documentoPaciente)}</div></div><a class="btn btn-primary" href="consultation.html?cita=${c.idCita}">Start consultation</a></div></div>`).join('');
        return;
      }
      const c = await Api.citas.obtener(cid);
      if (c.estado !== 'CHECK_IN') { emptyState(qs('#pickBox'), 'fa-ban', 'This appointment is not ready', 'The patient needs a check-in first (current status: ' + estadoLabel(c.estado) + ').'); return; }
      qs('#consBox').style.display = 'block';
      qs('#consInfo').innerHTML = `<strong>${esc(c.paciente)}</strong> · Document ${esc(c.documentoPaciente)} · ${formatDate(c.fecha)} ${fmtTime(c.horaInicio)} · ${esc(c.especialidad)}`;
      let rows = 0;
      const addRx = () => { rows++; qs('#rxBox').insertAdjacentHTML('beforeend', `<div class="form-row rx-row" style="grid-template-columns:2fr 1fr 2fr auto;align-items:end;margin-bottom:8px;">
        <div class="form-group" style="margin:0;"><label>Medication</label><input type="text" class="rx-med" maxlength="150"></div><div class="form-group" style="margin:0;"><label>Dose</label><input type="text" class="rx-dose" maxlength="100"></div>
        <div class="form-group" style="margin:0;"><label>Instructions</label><input type="text" class="rx-ind" maxlength="500"></div><button class="btn btn-danger btn-sm rx-del" type="button" aria-label="Remove"><i class="fa-solid fa-trash"></i></button></div>`); };
      qs('#addRx').addEventListener('click', addRx);
      qs('#rxBox').addEventListener('click', (e) => { const b = e.target.closest('.rx-del'); if (b) b.closest('.rx-row').remove(); });
      qs('#saveCons').addEventListener('click', async () => {
        const v = id => document.getElementById(id).value.trim();
        if (!v('cTx')) { toast('Treatment / indications are required.', 'error'); return; }
        if (v('tPa') && !/^\d{2,3}\/\d{2,3}$/.test(v('tPa'))) { toast('Blood pressure must look like 120/80.', 'error'); return; }
        const recetas = [...document.querySelectorAll('.rx-row')].map(r => ({ medicamento: r.querySelector('.rx-med').value.trim(), dosis: r.querySelector('.rx-dose').value.trim(), indicaciones: r.querySelector('.rx-ind').value.trim() || null })).filter(r => r.medicamento || r.dosis);
        if (recetas.some(r => !r.medicamento || !r.dosis)) { toast('Each prescription needs a medication and a dose.', 'error'); return; }
        const btn = qs('#saveCons'); btn.disabled = true;
        try {
          if (v('tPa') || v('tPeso') || v('tSv')) { try { await Api.triajes.registrar({ idCita: c.idCita, presionArterial: v('tPa') || null, peso: v('tPeso') ? Number(v('tPeso')) : null, signosVitales: v('tSv') || null }); } catch (e) { if (e.status !== 409) throw e; } }
          await Api.historiales.registrar({ idCita: c.idCita, diagnostico: v('cDx') || null, tratamiento: v('cTx'), observaciones: v('cObs') || null, recetas });
          await Api.citas.atender(c.idCita);
          toast('Consultation saved and appointment completed.', 'success'); setTimeout(() => location.href = 'agenda.html', 1200);
        } catch (e) { fail(e); btn.disabled = false; }
      });
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
