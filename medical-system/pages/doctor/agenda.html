<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Daily Agenda</h1><p id="pageSub">Patients scheduled for the selected day (RF-27).</p></div>
        
      </div>
      <div class="toolbar">
        <button class="btn btn-outline" id="prevDay" aria-label="Previous day"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="form-group" style="margin:0;"><input type="date" id="fDate" aria-label="Date"></div>
        <button class="btn btn-outline" id="nextDay" aria-label="Next day"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="btn btn-outline" id="todayBtn">Today</button>
      </div>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Patient</th><th>Document</th><th>Specialty</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="aBody"></tbody></table></div>
      <div id="aEmpty"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('agenda.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      const body = qs('#aBody'), empty = qs('#aEmpty');
      qs('#fDate').value = qparam('date') || today();
      async function load() {
        skeletonRows(body, 4, 7);
        const list = (await Api.citas.miAgenda(qs('#fDate').value)).sort(sortCitas);
        if (!list.length) { body.innerHTML = ''; emptyState(empty, 'fa-calendar', 'No appointments', 'Nothing is scheduled for ' + formatDate(qs('#fDate').value) + '.'); return; }
        empty.innerHTML = '';
        body.innerHTML = list.map(c => `<tr><td>${fmtTime(c.horaInicio)}</td><td>${esc(c.paciente)}</td><td>${esc(c.documentoPaciente)}</td><td>${esc(c.especialidad)}</td><td>${esc(c.numeroPabellon)} · ${esc(c.codigoRoom)}</td><td>${estadoBadge(c.estado)}</td>
          <td class="table-actions">
            ${c.estado === 'CHECK_IN' ? `<a class="btn btn-primary btn-sm" href="consultation.html?cita=${c.idCita}" data-tooltip="Start consultation"><i class="fa-solid fa-notes-medical"></i></a>` : ''}
            <a class="btn btn-outline btn-sm" href="patient-profile.html?doc=${encodeURIComponent(c.documentoPaciente)}" data-tooltip="Patient record"><i class="fa-solid fa-file-waveform"></i></a>
            ${['CONFIRMADA', 'REPROGRAMADA'].includes(c.estado) && c.fecha <= today() ? `<button class="btn btn-outline btn-sm" data-id="${c.idCita}" data-tooltip="Mark no-show"><i class="fa-solid fa-user-slash"></i></button>` : ''}</td></tr>`).join('');
      }
      body.addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (!b) return;
        confirmDialog('Mark this patient as a no-show?', () => safe(async () => { await Api.citas.noAsistio(b.dataset.id); toast('Marked as no-show.', 'success'); await load(); }), { danger: true, confirmText: 'Mark no-show' }); });
      qs('#fDate').addEventListener('change', () => safe(load));
      qs('#prevDay').addEventListener('click', () => { qs('#fDate').value = addDays(-1, qs('#fDate').value); safe(load); });
      qs('#nextDay').addEventListener('click', () => { qs('#fDate').value = addDays(1, qs('#fDate').value); safe(load); });
      qs('#todayBtn').addEventListener('click', () => { qs('#fDate').value = today(); safe(load); });
      await load();
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
