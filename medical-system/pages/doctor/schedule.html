<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Schedule</h1><p id="pageSub">Your appointments for the next 7 days. Time slots are managed by the administrator.</p></div>
        
      </div>
<div id="schBox"></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('schedule.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      const days = Array.from({ length: 7 }, (_, i) => addDays(i));
      const data = await Promise.all(days.map(d => Api.citas.miAgenda(d)));
      qs('#schBox').innerHTML = days.map((d, i) => { const list = data[i].filter(c => c.estado !== 'CANCELADA').sort(sortCitas); return `
        <div class="card" style="margin-bottom:16px;"><div class="flex justify-between items-center"><h4 style="margin:0;">${formatDateLong(d)}${d === today() ? ' <span class="badge badge-blue">Today</span>' : ''}</h4>
          <a href="agenda.html?date=${d}" class="btn btn-outline btn-sm">Open</a></div>
          ${list.length ? `<div style="margin-top:12px;">${list.map(c => `<div class="flex items-center justify-between" style="padding:8px 0;border-top:1px solid var(--color-border);"><span><strong>${fmtTime(c.horaInicio)}</strong> · ${esc(c.paciente)}</span>${estadoBadge(c.estado)}</div>`).join('')}</div>` : '<p class="text-muted" style="margin:8px 0 0;">No appointments.</p>'}</div>`; }).join('');
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
