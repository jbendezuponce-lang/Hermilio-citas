<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Patients | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">My Patients</h1><p id="pageSub">Look up a patient by document ID and open their clinical record.</p></div>
        
      </div>
      <div class="card" style="max-width:760px;margin-bottom:22px;"><h4>Find a patient</h4>
        <div class="flex gap-8"><input type="text" id="sDoc" maxlength="15" placeholder="Document ID" style="flex:1;"><button class="btn btn-primary" id="sGo"><i class="fa-solid fa-magnifying-glass"></i> Search</button></div></div>
      <div id="result" style="margin-bottom:22px;"></div>
      <div class="card"><h4>Today's patients</h4><div id="todayBox"></div></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('patients.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      qs('#sGo').addEventListener('click', () => safe(async () => {
        const d = qs('#sDoc').value.trim(); if (!d) { toast('Enter a document ID.', 'error'); return; }
        try {
          const p = await Api.pacientes.buscar(d);
          qs('#result').innerHTML = `<div class="card" style="max-width:760px;"><div class="flex items-center gap-16"><span class="avatar-lg">${initials(fullName(p))}</span><div style="flex:1;"><h3 style="margin:0;">${esc(fullName(p))}</h3><div class="text-muted">Document ${esc(p.documentoIdentidad)} · ${esc(p.correo)}</div></div>
            <a class="btn btn-primary" href="patient-profile.html?doc=${encodeURIComponent(p.documentoIdentidad)}">Open record</a></div></div>`;
        } catch (e) { if (e.status === 404) emptyState(qs('#result'), 'fa-user-slash', 'Patient not found', 'No patient is registered with that document ID.'); else throw e; }
      }));
      qs('#sDoc').addEventListener('keydown', (e) => { if (e.key === 'Enter') qs('#sGo').click(); });
      const citas = (await Api.citas.miAgenda(today())).sort(sortCitas);
      if (!citas.length) emptyState(qs('#todayBox'), 'fa-users', 'No patients today', 'Your patients for today will appear here.');
      else qs('#todayBox').innerHTML = citas.map(c => `<div class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--color-border);"><div class="flex items-center gap-12"><span class="avatar-sm">${initials(c.paciente)}</span><div><div style="font-weight:600;">${esc(c.paciente)}</div><div class="text-muted" style="font-size:.8rem;">${fmtTime(c.horaInicio)} · ${esc(c.documentoPaciente)}</div></div></div>
        <a class="btn btn-outline btn-sm" href="patient-profile.html?doc=${encodeURIComponent(c.documentoPaciente)}">Record</a></div>`).join('');
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
