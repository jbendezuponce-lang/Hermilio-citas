<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Profile | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Patient Record</h1><p id="pageSub">Personal data and clinical history (access is logged, RNF-14).</p></div>
        
      </div>
      <div id="pInfo" style="margin-bottom:22px;"></div>
      <h3>Clinical history</h3><div id="histBox"></div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="editModal">
  <div class="modal-box modal-lg">
    <div class="modal-header"><h3 id="editModalTitle">Edit clinical record</h3><button class="modal-close" onclick="closeModal('editModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="eId">
      <div class="form-group"><label for="eDx">Diagnosis</label><textarea id="eDx" rows="2"></textarea></div>
      <div class="form-group"><label for="eTx">Treatment / indications <span class="req">*</span></label><textarea id="eTx" rows="3"></textarea></div>
      <div class="form-group"><label for="eObs">Observations</label><textarea id="eObs" rows="2"></textarea></div>
      <p class="form-hint">Only the doctor who attended the appointment can edit its record.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-primary" id="eSave">Save changes</button>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('patient-profile.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      const box = qs('#histBox');
      const modalEdit = () => qs('#editModal');
      let records = [];
      function renderHist() {
        if (!records.length) { emptyState(box, 'fa-file-waveform', 'No clinical records', 'No consultations have been recorded for this patient yet.'); return; }
        box.innerHTML = '<div class="timeline">' + records.map(h => `
          <div class="timeline-item"><div class="timeline-date">${formatDate(h.fechaCita)}</div>
            <div class="card" style="margin-bottom:16px;"><div class="flex justify-between items-center" style="margin-bottom:8px;"><div><strong>${esc(h.medico)}</strong> <span class="text-muted">· ${esc(h.especialidad)}</span></div>
              <button class="btn btn-outline btn-sm" data-id="${h.idHistorial}"><i class="fa-solid fa-pen"></i> Edit</button></div>
              <p style="margin:6px 0;"><strong>Diagnosis:</strong> ${esc(h.diagnostico || '—')}</p><p style="margin:6px 0;"><strong>Treatment:</strong> ${esc(h.tratamiento)}</p>
              <p style="margin:6px 0;"><strong>Observations:</strong> ${esc(h.observaciones || '—')}</p>
              ${(h.recetas || []).length ? `<p style="margin:6px 0;"><strong>Prescriptions:</strong> ${h.recetas.map(r => esc(r.medicamento) + ' (' + esc(r.dosis) + ')').join(', ')}</p>` : ''}</div></div>`).join('') + '</div>';
      }
      async function loadHist(idPaciente) { box.innerHTML = ''; records = await Api.historiales.delPaciente(idPaciente); renderHist(); }
      box.addEventListener('click', (e) => {
        const b = e.target.closest('button[data-id]'); if (!b) return;
        const h = records.find(x => String(x.idHistorial) === b.dataset.id);
        qs('#eId').value = h.idHistorial; qs('#eDx').value = h.diagnostico || ''; qs('#eTx').value = h.tratamiento || ''; qs('#eObs').value = h.observaciones || ''; openModal('editModal');
      });
      qs('#eSave').addEventListener('click', () => safe(async () => {
        if (!qs('#eTx').value.trim()) { toast('Treatment / indications are required.', 'error'); return; }
        await Api.historiales.actualizar(qs('#eId').value, { diagnostico: qs('#eDx').value.trim() || null, tratamiento: qs('#eTx').value.trim(), observaciones: qs('#eObs').value.trim() || null, recetas: null });
        toast('Record updated.', 'success'); closeModal('editModal'); await loadHist(window.__pacienteId);
      }));

      const doc = qparam('doc'); if (!doc) { emptyState(qs('#pInfo'), 'fa-user-slash', 'No patient selected', 'Search a patient in “Patients”.'); return; }
      const p = await Api.pacientes.buscar(doc); window.__pacienteId = p.idPaciente;
      qs('#pageTitle').textContent = fullName(p);
      qs('#pInfo').innerHTML = `<div class="card" style="max-width:760px;"><table class="data-table" style="min-width:0;"><tbody>
        <tr><td style="font-weight:600;width:160px;">Document ID</td><td>${esc(p.documentoIdentidad)}</td></tr><tr><td style="font-weight:600;">Email</td><td>${esc(p.correo)}</td></tr>
        <tr><td style="font-weight:600;">Phone</td><td>${esc(p.telefonoContacto || '—')}</td></tr><tr><td style="font-weight:600;">Insurance</td><td>${esc(p.tipoSeguro || '—')}</td></tr>
        <tr><td style="font-weight:600;">Guardian data</td><td>${esc(p.datosApoderado || '—')}</td></tr></tbody></table></div>`;
      await loadHist(p.idPaciente);
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
