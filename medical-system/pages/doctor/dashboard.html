<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="welcomeMsg">Welcome back!</h1><p>Here's your schedule and patient activity for today.</p></div>
        <a href="consultation.html" class="btn btn-primary"><i class="fa-solid fa-notes-medical"></i> Register Consultation</a>
      </div>

      <div class="dashboard-grid" id="statsGrid"></div>

      <div class="two-col">
        <div class="card">
          <div class="flex justify-between items-center" style="margin-bottom:14px;">
            <h4 style="margin:0;">Today's Schedule</h4>
            <a href="agenda.html" style="font-size:.85rem;font-weight:600;">View agenda</a>
          </div>
          <div id="todaySchedule"></div>
        </div>
        <div>
          <div class="card" style="margin-bottom:22px;">
            <h4 style="margin-bottom:14px;">Quick Actions</h4>
            <div class="flex" style="flex-direction:column;gap:10px;">
              <a href="consultation.html" class="btn btn-outline btn-block"><i class="fa-solid fa-notes-medical"></i> Register Consultation</a>
              <a href="agenda.html" class="btn btn-outline btn-block"><i class="fa-solid fa-calendar-days"></i> View Agenda</a>
              <a href="patients.html" class="btn btn-outline btn-block"><i class="fa-solid fa-users"></i> My Patients</a>
            </div>
          </div>
          <div class="card">
            <div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Notifications</h4><a href="notifications.html" style="font-size:.85rem;font-weight:600;">View all</a></div>
            <div id="notifList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('dashboard.html');
    document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';

    const doctorId = user.doctorId;
    const appts = DB.get(DB_KEYS.appointments).filter(a => a.doctorId === doctorId);
    const patients = Object.fromEntries(DB.get(DB_KEYS.patients).map(p => [p.id, p]));
    const patientIds = new Set(appts.map(a => a.patientId));

    const todayAppts = appts.filter(a => a.date === today() && a.status !== 'Cancelled').sort((a, b) => a.time.localeCompare(b.time));
    const completed = appts.filter(a => a.status === 'Completed');
    const pending = appts.filter(a => a.status === 'Pending');
    const cancelled = appts.filter(a => a.status === 'Cancelled');

    document.getElementById('statsGrid').innerHTML = `
      <div class="card stat-card"><div class="stat-icon blue"><i class="fa-solid fa-calendar-day"></i></div><div><div class="stat-value">${todayAppts.length}</div><div class="stat-label">Today's Appointments</div></div></div>
      <div class="card stat-card"><div class="stat-icon teal"><i class="fa-solid fa-users"></i></div><div><div class="stat-value">${patientIds.size}</div><div class="stat-label">Total Patients</div></div></div>
      <div class="card stat-card"><div class="stat-icon green"><i class="fa-solid fa-circle-check"></i></div><div><div class="stat-value">${completed.length}</div><div class="stat-label">Completed Consultations</div></div></div>
      <div class="card stat-card"><div class="stat-icon amber"><i class="fa-solid fa-hourglass-half"></i></div><div><div class="stat-value">${pending.length}</div><div class="stat-label">Pending Appointments</div></div></div>`;

    const scheduleBox = document.getElementById('todaySchedule');
    if (todayAppts.length === 0) {
      emptyState(scheduleBox, 'fa-calendar-xmark', 'No appointments today', 'Enjoy your day off, or check the agenda for upcoming visits.');
    } else {
      scheduleBox.innerHTML = todayAppts.map(a => {
        const p = patients[a.patientId];
        return `<div class="calendar-day-slot">
          <div class="time">${a.time}</div>
          <img src="${p.photo}" class="avatar-sm" style="border-radius:50%;object-fit:cover;width:34px;height:34px;" alt="">
          <div style="flex:1;"><strong style="font-size:.9rem;">${p.name}</strong><div class="text-muted" style="font-size:.8rem;">${a.reason}</div></div>
          ${statusBadge(a.status)}
        </div>`;
      }).join('');
    }

    const notifs = DB.get(DB_KEYS.notifications).filter(n => n.userId === user.id).slice(0, 4);
    const notifList = document.getElementById('notifList');
    if (notifs.length === 0) { emptyState(notifList, 'fa-bell-slash', 'No notifications', "You're all caught up!"); }
    else {
      notifList.innerHTML = notifs.map(n => `<div style="padding:10px 0;border-bottom:1px solid var(--color-border);">
        <div style="font-weight:600;font-size:.87rem;">${n.title}</div><div class="text-muted" style="font-size:.8rem;">${n.message}</div></div>`).join('');
    }
  }
</script>
</body>
</html>
