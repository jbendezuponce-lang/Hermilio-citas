<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Dashboard | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="content-area">
      <div class="content-header">
        <div><h1 id="pageTitle">Welcome back!</h1><p id="pageSub">Your day at a glance.</p></div>
        
      </div>
      <div class="dashboard-grid" id="statsGrid"></div>
      <div class="card"><div class="flex justify-between items-center" style="margin-bottom:14px;"><h4 style="margin:0;">Today's Patients</h4><a href="agenda.html" style="font-size:.85rem;font-weight:600;">Open agenda</a></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Patient</th><th>Document</th><th>Specialty</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody id="tBody"></tbody></table></div><div id="tEmpty"></div></div>
    </div>
  </div>
</div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  const user = Auth.requireRole(['doctor']);
  if (user) {
    renderPortalLayout('dashboard.html');
    (async () => {
      try {

      const sortCitas = (a, b) => (a.fecha + a.horaInicio).localeCompare(b.fecha + b.horaInicio);

      qs('#pageTitle').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';
      qs('#pageSub').textContent = "Your day at a glance.";
      const citas = (await Api.citas.miAgenda(today())).sort(sortCitas);
      const n = e => citas.filter(c => c.estado === e).length;
      const card = (icon, color, v, l) => `<div class="card stat-card"><div class="stat-icon ${color}"><i class="fa-solid ${icon}"></i></div><div><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div></div>`;
      qs('#statsGrid').innerHTML = card('fa-calendar-day', 'blue', citas.length, "Today's Appointments") + card('fa-clipboard-check', 'teal', n('CHECK_IN'), 'Waiting (checked in)') +
        card('fa-circle-check', 'green', n('ATENDIDA'), 'Attended') + card('fa-calendar-xmark', 'red', n('CANCELADA') + n('NO_ASISTIO'), 'Cancelled / no-show');
      if (!citas.length) emptyState(qs('#tEmpty'), 'fa-calendar', 'No appointments today', 'Enjoy a quiet day.');
      else qs('#tBody').innerHTML = citas.map(c => `<tr><td>${fmtTime(c.horaInicio)}</td><td>${esc(c.paciente)}</td><td>${esc(c.documentoPaciente)}</td><td>${esc(c.especialidad)}</td><td>${esc(c.numeroPabellon)} · ${esc(c.codigoRoom)}</td><td>${estadoBadge(c.estado)}</td>
        <td class="table-actions">${c.estado === 'CHECK_IN' ? `<a class="btn btn-primary btn-sm" href="consultation.html?cita=${c.idCita}"><i class="fa-solid fa-notes-medical"></i> Start</a>` : ''}</td></tr>`).join('');
      } catch (e) { fail(e); }
    })();
  }
</script>
</body>
</html>
