<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="public-navbar-mount"></div>

<section class="page-hero">
  <div class="container">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you. Reach out with any questions.</p>
  </div>
</section>

<section class="section">
  <div class="container two-col">
    <div class="card">
      <h3>Send us a message</h3>
      <form id="contactForm" novalidate>
        <div class="form-group">
          <label for="cFullName">Full Name <span class="req">*</span></label>
          <input type="text" id="cFullName" name="fullName" placeholder="Jane Doe">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="cEmail">Email <span class="req">*</span></label>
            <input type="email" id="cEmail" name="email" placeholder="jane@example.com">
          </div>
          <div class="form-group">
            <label for="cPhone">Phone</label>
            <input type="tel" id="cPhone" name="phone" placeholder="+1 (555) 000-0000">
          </div>
        </div>
        <div class="form-group">
          <label for="cSubject">Subject <span class="req">*</span></label>
          <input type="text" id="cSubject" name="subject" placeholder="How can we help?">
        </div>
        <div class="form-group">
          <label for="cMessage">Message <span class="req">*</span></label>
          <textarea id="cMessage" name="message" placeholder="Write your message..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Send Message</button>
      </form>
    </div>

    <div>
      <div class="card" style="margin-bottom:20px;">
        <h4><i class="fa-solid fa-location-dot"></i> Address</h4>
        <p>120 Wellness Ave, Downtown, Springfield</p>
      </div>
      <div class="card" style="margin-bottom:20px;">
        <h4><i class="fa-solid fa-phone"></i> Phone</h4>
        <p>+1 (555) 010-2200</p>
      </div>
      <div class="card" style="margin-bottom:20px;">
        <h4><i class="fa-solid fa-envelope"></i> Email</h4>
        <p>support@medicareplus.com</p>
      </div>
      <div class="card" style="margin-bottom:20px;">
        <h4><i class="fa-solid fa-clock"></i> Opening Hours</h4>
        <p>Mon–Fri: 8:00 AM – 6:00 PM<br>Sat: 9:00 AM – 1:00 PM<br>Sun: Closed</p>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="height:220px;background:var(--color-primary-light);display:flex;align-items:center;justify-content:center;color:var(--color-primary);">
          <i class="fa-solid fa-map-location-dot" style="font-size:2.4rem;"></i>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  renderPublicNavbar('contact');
  renderFooter();

  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    clearAllFieldErrors(form);
    let valid = true;

    const fullName = form.fullName.value.trim();
    const email = form.email.value.trim();
    const phone = form.phone.value.trim();
    const subject = form.subject.value.trim();
    const message = form.message.value.trim();

    if (!fullName) { showFieldError(form.fullName, 'Full name is required.'); valid = false; }
    if (!email) { showFieldError(form.email, 'Email is required.'); valid = false; }
    else if (!isValidEmail(email)) { showFieldError(form.email, 'Enter a valid email address.'); valid = false; }
    if (phone && !isValidPhone(phone)) { showFieldError(form.phone, 'Enter a valid phone number.'); valid = false; }
    if (!subject) { showFieldError(form.subject, 'Subject is required.'); valid = false; }
    if (!message || message.length < 10) { showFieldError(form.message, 'Message must be at least 10 characters.'); valid = false; }

    if (!valid) return;
    toast('Your message has been sent. We will get back to you soon!', 'success');
    form.reset();
  });
</script>
</body>
</html>
