<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a Doctor | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="public-navbar-mount"></div>

<section class="page-hero">
  <div class="container">
    <h1>Find a Doctor</h1>
    <p>Browse our directory of specialists and book your visit.</p>
  </div>
</section>

<section class="section" style="padding-top:40px;">
  <div class="container">
    <div class="toolbar">
      <div class="search-input"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="docSearch" placeholder="Search by doctor name..."></div>
      <select class="filter-select" id="filterSpecialty"><option value="">All Specialties</option></select>
    </div>
    <p class="text-muted" id="resultCount"></p>
    <div class="grid grid-4" id="docGrid"></div>
    <div id="docEmpty"></div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  renderPublicNavbar('doctors');
  renderFooter();
  (async () => {
    try {
      const [specs, docs] = await Promise.all([Api.especialidades.list(), Api.medicos.list()]);
      document.getElementById('filterSpecialty').innerHTML += specs.map(s => `<option value="${s.idEspecialidad}">${esc(s.nombreEspecialidad)}</option>`).join('');
      const sp = new URLSearchParams(location.search).get('specialty');
      if (sp) document.getElementById('filterSpecialty').value = sp;
      function render() {
        const term = document.getElementById('docSearch').value.toLowerCase().trim(), spec = document.getElementById('filterSpecialty').value;
        const list = docs.filter(d => (!term || fullName(d).toLowerCase().includes(term)) && (!spec || String(d.idEspecialidad) === spec));
        document.getElementById('resultCount').textContent = `${list.length} doctor${list.length !== 1 ? 's' : ''} found`;
        const grid = document.getElementById('docGrid'), empty = document.getElementById('docEmpty');
        if (!list.length) { grid.innerHTML = ''; emptyState(empty, 'fa-user-doctor', 'No doctors found', 'Try adjusting your search or filters.'); return; }
        empty.innerHTML = '';
        grid.innerHTML = list.map(d => `
          <div class="card card-hover doctor-card"><div class="doc-body" style="text-align:center;">
            <span class="avatar-lg" style="margin:0 auto 12px;">${initials(fullName(d))}</span>
            <div class="doc-name">${esc(fullName(d))}</div><div class="doc-spec">${esc(d.especialidad)}</div>
            <div class="doc-meta" style="justify-content:center;"><span><i class="fa-solid fa-id-card"></i> ${esc(d.numeroColegiatura)}</span></div>
            <div class="doc-actions"><a href="doctor-profile.html?id=${d.idMedico}" class="btn btn-outline btn-sm">View Profile</a><a href="../auth/login.html" class="btn btn-primary btn-sm">Book</a></div></div></div>`).join('');
      }
      ['docSearch', 'filterSpecialty'].forEach(id => { document.getElementById(id).addEventListener('input', debounce(render, 120)); document.getElementById(id).addEventListener('change', render); });
      render();
    } catch (e) { fail(e); }
  })();
</script>
</body>
</html>
