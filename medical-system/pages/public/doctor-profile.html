<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Profile | MediCare+</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/forms.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div id="public-navbar-mount"></div>

<section class="section" style="padding-top:32px;">
  <div class="container">
    <div class="breadcrumbs">
      <a href="../../index.html">Home</a><span class="sep">/</span>
      <a href="doctors.html">Doctors</a><span class="sep">/</span>
      <span class="current" id="crumbName">Profile</span>
    </div>

    <div class="two-col" id="profileWrap"></div>
  </div>
</section>

<div id="footer-mount"></div>

<script src="../../js/data.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/utils.js"></script>
<script src="../../js/navigation.js"></script>
<script>
  renderPublicNavbar('doctors');
  renderFooter();
  (async () => {
    const wrap = document.getElementById('profileWrap');
    try {
      const id = new URLSearchParams(location.search).get('id');
      const doctor = (await Api.medicos.list()).find(d => String(d.idMedico) === String(id));
      if (!doctor) { wrap.innerHTML = ''; emptyState(wrap, 'fa-user-doctor', 'Doctor not found', 'This profile may have been removed or the doctor is inactive.'); return; }
      document.getElementById('crumbName').textContent = fullName(doctor);
      wrap.innerHTML = `
        <div><div class="card" style="text-align:center;padding:30px;">
          <span class="avatar-lg" style="margin:0 auto 16px;width:120px;height:120px;font-size:2.2rem;">${initials(fullName(doctor))}</span>
          <h2 style="margin-bottom:2px;">${esc(fullName(doctor))}</h2><div class="doc-spec" style="font-size:1rem;">${esc(doctor.especialidad)}</div>
          <div class="flex gap-12" style="justify-content:center;margin:14px 0 18px;"><span><i class="fa-solid fa-id-card"></i> License ${esc(doctor.numeroColegiatura)}</span></div>
          <a href="../auth/login.html" class="btn btn-primary btn-block"><i class="fa-solid fa-calendar-plus"></i> Sign in to book</a></div></div>
        <div><div class="card"><h4>About</h4><p>${esc(fullName(doctor))} attends outpatient consultations in <strong>${esc(doctor.especialidad)}</strong> at Hospital Hermilio Valdizán.</p>
          <p class="text-muted">Available time slots are shown when you sign in and start booking an appointment.</p></div></div>`;
    } catch (e) { wrap.innerHTML = ''; fail(e); }
  })();
</script>
</body>
</html>
