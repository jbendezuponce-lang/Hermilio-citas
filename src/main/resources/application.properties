# ============================================================
# Hospital Hermilio Valdizán - Backend de gestión de citas
# ============================================================
spring.application.name=hermilio-citas-backend
server.port=${SERVER_PORT:8080}

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hermilio_citas}
# CAMBIO 1: El usuario por defecto ahora es 'root' (el que usas en Workbench)
spring.datasource.username=${DB_USERNAME:root}
# CAMBIO 2: Pon tu contraseña local de MySQL después de los dos puntos
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# Lo dejamos en 'none' porque ya creaste las tablas manualmente con el script
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ---------- Ejecución opcional de schema.sql / data.sql ----------
# Como ya ejecutaste el código en Workbench, lo dejamos en 'never' para que no intente crearlo de nuevo
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8

# ---------- Seguridad JWT (RNF-02) ----------
# CAMBIO 3: JWT exige un secreto de al menos 32 caracteres. Agregamos uno por defecto para local.
app.jwt.secret=${JWT_SECRET:esta_es_una_clave_secreta_super_segura_para_el_sistema_hermilio_citas}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.jwt.reset-expiration-minutes=15

# ---------- Aplicación ----------
app.timezone=${APP_TIMEZONE:America/Lima}
app.notificaciones.recordatorio-cron=${RECORDATORIO_CRON:0 0 8 * * *}

# Administrador inicial (RF-31). 
app.bootstrap.admin-documento=${ADMIN_DOCUMENTO:}
app.bootstrap.admin-correo=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Cuentas de prueba (una por rol) para desarrollo local. Se crean/reparan al arrancar.
#   admin@hermilio.com, medico@hermilio.com, recepcion@hermilio.com, paciente@hermilio.com
# En PRODUCCION: SEED_DEMO_USERS=false
app.bootstrap.cuentas-demo=${SEED_DEMO_USERS:true}
app.bootstrap.password-demo=${DEMO_PASSWORD:admin123}

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=${APP_TIMEZONE:America/Lima}