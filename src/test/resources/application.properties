# Configuración de pruebas: H2 en memoria (modo MySQL). Hibernate crea el esquema a partir de las entidades.
spring.datasource.url=jdbc:h2:mem:citas_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
app.jwt.secret=clave-solo-para-pruebas-0123456789-abcdefghijklmnopqrstuvwxyz
app.jwt.expiration-minutes=60
app.jwt.reset-expiration-minutes=15
app.timezone=America/Lima
app.notificaciones.recordatorio-cron=-
app.bootstrap.admin-documento=
app.bootstrap.admin-correo=
app.bootstrap.admin-password=
